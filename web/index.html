<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Planora — House Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--p:#141a22;--p2:#1b222d;--p3:#232c39;--ln:#262f3c;--tx:#e7ecf3;--mu:#8793a5;--ac:#5b8cff;--ac2:#4fd1b0;--dg:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--p);border-bottom:1px solid var(--ln);z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px}
.brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#5b8cff,#4fd1b0);display:grid;place-items:center;color:#06101f}
.brand i svg{width:16px;height:16px;stroke-width:2.4}
.pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;width:170px;font-weight:500;min-width:0}
.pname:hover,.pname:focus{border-color:var(--ln);background:var(--p2);outline:0}
.grow{flex:1}
.seg{display:flex;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;color:var(--mu);padding:5px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.ib{width:36px;height:36px;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--p2);border-color:var(--ln)}
.ib:disabled{opacity:.3;cursor:default}
.only-m{display:none}
#main{flex:1;display:flex;min-height:0;position:relative}
#tools{width:68px;flex:none;background:var(--p);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:3px;overflow-y:auto;z-index:5}
.tb{width:56px;height:54px;border-radius:12px;border:0;background:transparent;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:500;cursor:pointer;flex:none}
.tb svg{width:22px;height:22px}
.tb:hover{background:var(--p2);color:var(--tx)}
.tb.on{background:var(--ac);color:#fff}
.sep{height:1px;width:36px;background:var(--ln);margin:5px 0;flex:none}
#stage{flex:1;position:relative;display:flex;min-width:0;min-height:0}
.pane{position:relative;flex:1;min-width:0;min-height:0;display:none;overflow:hidden}
#stage.v2d #p2,#stage.v3d #p3,#stage.vs #p2,#stage.vs #p3{display:block}
#stage.vs #p3{border-left:1px solid var(--ln)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
#c2{cursor:crosshair}
#c3{cursor:grab}
.float{position:absolute;display:flex;gap:4px;align-items:center;background:rgba(20,26,34,.92);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:14px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:4}
.float button{border:0;background:transparent;color:var(--tx);height:34px;min-width:34px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.float button:hover{background:var(--p3)}
.float button.pri{background:var(--ac);color:#fff}
.float button.dg:hover{background:rgba(255,107,107,.18);color:var(--dg)}
.float .lab{padding:0 10px;color:var(--mu);font-weight:600;font-size:12px}
#ctx{top:10px;left:50%;transform:translateX(-50%);display:none}
#drawbar{bottom:14px;left:50%;transform:translateX(-50%);display:none}
#zoom{right:10px;bottom:10px;flex-direction:column}
#hint{position:absolute;left:12px;top:10px;color:var(--mu);font-size:12px;background:rgba(13,17,23,.65);padding:5px 10px;border-radius:8px;pointer-events:none;max-width:60%}
#readout{position:absolute;left:12px;bottom:10px;color:var(--mu);font-size:11px;pointer-events:none;font-variant-numeric:tabular-nums}
#hud3{left:10px;top:10px;flex-wrap:wrap}
#lvbar{right:10px;top:10px;flex-direction:column;z-index:6;padding:4px;gap:3px}
.float button.on{background:var(--ac);color:#fff}
.lvb{width:36px;padding:0!important;justify-content:center;font-weight:700!important}
#dpad{position:absolute;left:14px;bottom:14px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px;z-index:4}
#dpad.on{display:grid}
#dpad button{border:1px solid var(--ln);background:rgba(20,26,34,.85);border-radius:12px;color:var(--tx);font-size:18px;touch-action:none}
.pane .tag3{position:absolute;right:12px;bottom:10px;color:var(--mu);font-size:11px;pointer-events:none}
.err3{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);padding:30px;text-align:center}
#side{width:324px;flex:none;background:var(--p);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;z-index:20}
#tabs{display:flex;border-bottom:1px solid var(--ln);flex:none}
#tabs button{flex:1;border:0;background:transparent;color:var(--mu);padding:12px 4px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
#tabs button.on{color:var(--tx);border-bottom-color:var(--ac)}
#body{flex:1;overflow-y:auto;padding:14px;-webkit-user-select:none;user-select:none;overscroll-behavior:contain}
#body::-webkit-scrollbar{width:8px}#body::-webkit-scrollbar-thumb{background:var(--p3);border-radius:8px}
h4{margin:18px 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);font-weight:600}
h4:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--ln);background:var(--p2);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--tx);font-size:11px;text-align:center;min-width:0}
.card:hover{border-color:var(--ac);background:var(--p3)}
.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.card canvas{position:static;width:56px;height:56px}
.card span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--mu)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chip{border:1px solid var(--ln);background:var(--p2);color:var(--mu);padding:4px 10px;border-radius:99px;cursor:pointer;font-size:12px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.search{width:100%;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.search:focus,.fl input:focus,.fl select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.fl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.fl>span{color:var(--mu);flex:none}
.fl input[type=number],.fl input[type=text],.fl select{width:140px;background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;-webkit-user-select:text;user-select:text}
.fl input[type=range]{width:140px;accent-color:var(--ac)}
.fl input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.fl select{appearance:none;padding-right:8px}
.sws{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;box-shadow:0 0 0 1px var(--ln) inset;cursor:pointer;padding:0}
.sw.on{border-color:var(--ac)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{border:1px solid var(--ln);background:var(--p2);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--p3)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.dg{color:var(--dg)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat div{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mu)}
.tt{font-size:15px;font-weight:700;margin-bottom:2px}.sub{color:var(--mu);margin-bottom:14px}
.muted{color:var(--mu);font-size:12px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#0b0f14;border:1px solid var(--ln);padding:9px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.65);display:none;align-items:center;justify-content:center;z-index:90;padding:14px}
#modal.on{display:flex}
#mbox{background:var(--p);border:1px solid var(--ln);border-radius:18px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text}
#mbox h3{margin:0 0 4px;font-size:18px}
#mbox textarea{width:100%;height:170px;background:var(--p2);border:1px solid var(--ln);border-radius:10px;padding:10px;font:11px/1.4 ui-monospace,Menlo,monospace;resize:vertical}
#mbox img{width:100%;border-radius:10px;border:1px solid var(--ln)}
.mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
.mrow .btn{justify-content:center;flex-direction:column;padding:14px 8px;gap:4px;text-align:center}
.mrow .btn small{color:var(--mu);font-weight:400}
kbd{background:var(--p3);border:1px solid var(--ln);border-radius:5px;padding:1px 6px;font-size:11px}
table.k{width:100%;border-collapse:collapse}table.k td{padding:4px 0;border-bottom:1px solid var(--ln);color:var(--mu)}table.k td:first-child{color:var(--tx);width:44%}
@media(max-width:820px){
 .only-m{display:grid}.hide-m{display:none!important}
 .pname{width:110px;flex:1;min-width:0}.brand{display:none}#top{gap:6px;padding:0 8px}
 #main{flex-direction:column-reverse}
 #tools{width:auto;height:62px;flex-direction:row;border-right:0;border-top:1px solid var(--ln);padding:3px 6px;overflow-x:auto;overflow-y:hidden;gap:2px}
 .sep{width:1px;height:34px;margin:0 4px}
 #stage.vs{flex-direction:column}
 #stage.vs #p3{border-left:0;border-top:1px solid var(--ln)}
 #side{position:fixed;left:0;right:0;bottom:62px;width:auto;height:48vh;height:48dvh;border-radius:18px 18px 0 0;border:1px solid var(--ln);transform:translateY(115%);transition:transform .25s;box-shadow:0 -10px 40px rgba(0,0,0,.45)}
 #side.open{transform:none}
 #hint{display:none}
 #readout{display:none}
 #ctx{max-width:calc(100% - 16px);overflow-x:auto}
 #toast{bottom:150px}
}
</style>
</head>
<body>
<div id="app">
 <header id="top">
  <div class="brand"><i><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg></i><b>Planora</b></div>
  <input id="pname" class="pname" spellcheck="false" aria-label="Project name">
  <div class="seg" id="viewSeg"><button data-v="2d">2D</button><button data-v="vs" class="hide-m">Split</button><button data-v="3d">3D</button></div>
  <div class="grow"></div>
  <button class="ib" id="bUndo" title="Undo (Ctrl+Z)"></button>
  <button class="ib" id="bRedo" title="Redo (Ctrl+Shift+Z)"></button>
  <button class="ib" id="bExport" title="Export"></button>
  <button class="ib" id="bMenu" title="Menu"></button>
  <button class="ib only-m" id="bPanel" title="Panel"></button>
 </header>
 <div id="main">
  <nav id="tools"></nav>
  <div id="stage" class="v2d">
   <div class="pane" id="p2">
    <canvas id="c2"></canvas>
    <div id="hint"></div><div id="readout"></div>
    <div class="float" id="ctx"></div>
    <div class="float" id="drawbar"></div>
    <div class="float" id="zoom"><button data-act="zin" title="Zoom in"></button><button data-act="zout" title="Zoom out"></button><button data-act="fit" title="Fit to plan"></button></div>
   </div>
   <div class="pane" id="p3">
    <canvas id="c3"></canvas>
    <div class="float" id="hud3"></div>
    <div id="dpad"><span></span><button data-d="f">▲</button><span></span><button data-d="l">◀</button><button data-d="b">▼</button><button data-d="r">▶</button></div>
    <div class="tag3" id="tag3"></div>
   </div>
   <div class="float" id="lvbar"></div>
  </div>
  <aside id="side"><div id="tabs"><button data-tab="lib">Library</button><button data-tab="insp">Properties</button><button data-tab="scene">3D Scene</button></div><div id="body"></div></aside>
 </div>
</div>
<div id="toast"></div>
<div id="modal"><div id="mbox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),PI=Math.PI,TAU=PI*2;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SEED=1;const srnd=()=>(SEED=(SEED*16807)%2147483647)/2147483647,hashS=x=>{let h=7;for(const c of String(x))h=(h*31+c.charCodeAt(0))%1000003;return h+1};
const rnd=(()=>{let s=20240611;return()=>(s=(s*16807)%2147483647)/2147483647})();
const ICON={
 garden:'<path d="M12 21v-7"/><path d="M12 14c-4 0-6-3-6-6 4 0 6 2 6 6zM12 14c4 0 6-3 6-6-4 0-6 2-6 6z"/><path d="M4 21h16"/>',export:'<path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"/>',
 select:'<path d="M5 3l14 8-6.5 1.8L10 19z"/>',wall:'<path d="M3 5h18v14H3zM3 12h18M9 5v7M15 12v7"/>',room:'<rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 11h6v8"/>',
 poly:'<path d="M5 18l2.5-11 8-3.5 4 9-6.5 7.5z"/>',door:'<path d="M6 21V3h12v18M3 21h18"/><circle cx="15" cy="12.5" r=".9"/>',window:'<rect x="4" y="4" width="16" height="16" rx="1"/><path d="M12 4v16M4 12h16"/>',
 furn:'<path d="M5 11V8a3 3 0 013-3h8a3 3 0 013 3v3M3 13.5a2 2 0 014 0V15h10v-1.5a2 2 0 014 0V19H3zM6 19v2M18 19v2"/>',pan:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>',redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',panel:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/>',
 rot:'<path d="M20 11a8 8 0 10-2.3 6"/><path d="M20 4v7h-7"/>',fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 walk:'<circle cx="13" cy="4.5" r="2"/><path d="M12 8l-2 5 3 3 1 5M10 13l-3 1M12 8l4 3 2-1M13 16l-3 5"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
 balcony:'<path d="M5 10V5h14v5M3 10h18M3 20h18M6 10v10M10 10v10M14 10v10M18 10v10"/>',tunnel:'<path d="M4 20V11a8 8 0 0116 0v9M9 20v-7a3 3 0 016 0v7M2 20h20"/>',
 cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>',cam:'<path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24">${ICON[n]||''}</svg>`;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1900)}
function showModal(html){const b=$('#mbox');b.innerHTML=html;$('#modal').classList.add('on')}
function hideModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('pointerdown',e=>{if(e.target.id==='modal')hideModal()});

/* ================= catalogs ================= */
const FLOORS={oak:{n:'Oak wood',c:'#c49a6c',sz:2.4,r:.55},walnut:{n:'Dark walnut',c:'#6b4a33',sz:2.4,r:.5},tile:{n:'White tile',c:'#e4e7ea',sz:2,r:.25},slate:{n:'Slate tile',c:'#5d6670',sz:2,r:.35},
 marble:{n:'Marble',c:'#ebe8e3',sz:3,r:.2},carpet:{n:'Carpet',c:'#b3a595',sz:1.5,r:1},concrete:{n:'Concrete',c:'#9a9ea3',sz:3,r:.85},terra:{n:'Terracotta',c:'#b8683f',sz:2,r:.6},lawn:{n:'Lawn',c:'#5e8f48',sz:3,r:1},gravel:{n:'Gravel',c:'#b4aea1',sz:2,r:1},deck:{n:'Timber deck',c:'#9b7650',sz:2.4,r:.7},paving:{n:'Paving',c:'#a8a59e',sz:2,r:.8}};
const WALLM={paint:{n:'Paint',c:'#f1ece4'},brick:{n:'Brick',c:'#a65b46',sz:1.28},concrete:{n:'Concrete',c:'#a7abaf',sz:3},wood:{n:'Wood panel',c:'#a47a52',sz:2},stone:{n:'Stone',c:'#b2a894',sz:2}};
const PAINTS=['#f1ece4','#ffffff','#e3dccf','#d3c4ad','#c9d6df','#b9cdb5','#e8c9c1','#f2d89b','#8fa3b5','#5f6b7a','#2f3640','#c97b63'];
const FCOL=['#6d7f96','#8c6d52','#d9d3c7','#3f4650','#a4513b','#4d7a63','#c9a24b','#e8e4dc','#2d3a4f','#b88fa8','#78909c','#222222'];
const OT={door:{n:'Single door',k:'door',w:.9,h:2.1,s:0},door2:{n:'Double door',k:'door',w:1.6,h:2.1,s:0,dbl:1},slide:{n:'Sliding door',k:'door',w:2,h:2.2,s:0,sl:1},french:{n:'French door',k:'door',w:1.5,h:2.2,s:0,dbl:1,gl:1},
 arch:{n:'Archway',k:'arch',w:1.2,h:2.2,s:0},garage:{n:'Garage door',k:'door',w:2.8,h:2.2,s:0,gar:1},win:{n:'Window',k:'win',w:1.2,h:1.2,s:.9},winw:{n:'Wide window',k:'win',w:2,h:1.2,s:.9},
 winp:{n:'Picture window',k:'win',w:2.4,h:1.6,s:.6},wins:{n:'Small window',k:'win',w:.6,h:.6,s:1.5},
 glassd:{n:'Glass door',k:'door',w:1,h:2.2,s:0,gd:1},bifold:{n:'Bi-fold door',k:'door',w:2.6,h:2.2,s:0,bf:1},barn:{n:'Barn sliding door',k:'door',w:1.1,h:2.15,s:0,sl:1,barn:1},pocket:{n:'Pocket door',k:'door',w:.9,h:2.1,s:0,sl:1,pk:1},roll:{n:'Roller shutter',k:'door',w:2.6,h:2.2,s:0,gar:1,roll:1},
 gate:{n:'Main gate (swing)',k:'door',g:1,w:3.2,h:2,s:0,dbl:1,gt:1},gslide:{n:'Sliding gate',k:'door',g:1,w:3.6,h:1.9,s:0,sl:1,gs:1},gsmall:{n:'Pedestrian gate',k:'door',g:1,w:1,h:1.8,s:0,gt:1}};
