<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cousin Heaven</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#ff7aa2">
<style>
:root{--bg:#fff4e0;--card:#fff;--ink:#3b2a4a;--mut:#8a7a99;--pink:#ff7aa2;--teal:#2bb8ae;--gold:#f7b731;--pur:#8b6cf6;--red:#ef5350;--line:#f0e2c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:19px;margin:0;flex:1}
button{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 14px;cursor:pointer;font-weight:600}
button.pri{background:var(--pink);border-color:var(--pink);color:#fff}
button.teal{background:var(--teal);border-color:var(--teal);color:#fff}
button.sm{padding:5px 10px;font-size:13px;border-radius:10px}
button.ghost{background:none;border:none;padding:6px 10px}
button:disabled{opacity:.5}
#main{flex:1;padding:4px 12px calc(env(safe-area-inset-bottom) + 16px)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.sub{color:var(--mut);font-size:13px}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none;border:2px solid #fff;box-shadow:0 1px 0 #0002}
.av.sm{width:26px;height:26px;font-size:15px}.av.lg{width:56px;height:56px;font-size:32px}
.dotOn{position:relative}.dotOn::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#34c759;border:2px solid #fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:22px;padding:16px 12px;text-align:center;color:#fff;font-weight:800;font-size:17px;cursor:pointer;position:relative;box-shadow:0 4px 0 #0002}
.tile b{display:block;font-size:44px;margin-bottom:2px}
.badge{position:absolute;top:8px;right:10px;background:#fff;color:var(--red);border-radius:12px;padding:1px 8px;font-size:13px}
.pill{background:#fff;border:2px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
h2{font-size:17px;margin:14px 0 8px}
input,textarea,select{font:inherit;color:var(--ink);width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff}
textarea{min-height:46vh;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px;font-weight:600}
.modal{position:fixed;inset:0;background:#2b1a4a99;display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 8px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#3b2a4a;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;display:none;max-width:90vw;text-align:center}
#conn{background:var(--red);color:#fff;text-align:center;font-size:13px;padding:3px;display:none}
/* chat */
#msgs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;height:calc(100vh - 230px);padding:4px 2px}
.m{display:flex;gap:8px;align-items:flex-end;max-width:88%}.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 1px 0 var(--line);word-break:break-word}.m.me .bub{background:var(--pink);color:#fff}
.bub small{display:block;font-size:11px;opacity:.7}
.stk{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.stk button{white-space:nowrap;padding:5px 10px;font-size:13px}
/* games */
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;font-size:17px}
.opt.ok{background:#c8f7d4;border-color:#34c759}.opt.bad{background:#ffd6d6;border-color:var(--red)}.opt.mine{border-color:var(--pur)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mc{aspect-ratio:1;border-radius:14px;background:var(--pur);color:#fff;font-size:34px;display:flex;align-items:center;justify-content:center;border:0;padding:0}.mc.up{background:#fff;border:3px solid var(--line)}.mc.got{background:#d8f5e8;border:3px solid #34c759}
.tile2{display:inline-flex;width:46px;height:54px;background:var(--gold);border-radius:10px;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:3px;box-shadow:0 3px 0 #c98a00;color:#fff}
.score{display:flex;gap:8px;overflow-x:auto}.score .card{min-width:84px;text-align:center;padding:8px;margin:0}
.turn{outline:3px solid var(--gold)}
canvas{width:100%;border-radius:16px;background:#fff7e6;touch-action:none;display:block}
.bar{height:10px;background:#f1e5cf;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}
.gc{display:flex;gap:12px;align-items:center;padding:12px}.gc b.e{font-size:36px}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.letter{font-size:44px;text-align:center;font-family:"Noto Naskh Arabic","Amiri",serif;direction:rtl}
.ar{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;font-size:24px;direction:rtl;text-align:right;line-height:1.9}
.chip{padding:5px 12px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}.chip.on{background:var(--pur);color:#fff;border-color:var(--pur)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.ph{aspect-ratio:1;object-fit:cover;width:100%;border-radius:12px;background:#eee}
.lb{display:flex;align-items:center;gap:8px;margin:6px 0}
</style></head><body>
<div id="app"><div id="conn">Reconnecting…</div><header id="hd"></header><div id="main"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let token=null;try{token=localStorage.getItem('cousin_token')}catch(e){}
let S={wl:[],win:null,trk:[],trkTotal:0,wazes:[],lessons:[],users:[],online:[],chat:[],notes:[],locks:{},deeds:[],tdone:[],once:[],board:[],week:[],events:[],photos:[],rooms:[],room:null,games:{},typing:{},unread:0};
let albSel=null,me=null,ws=null,view='hub',wsOk=false,retry=0,openNote=null,album='All',viewer=null,lbTab='week';
const U=id=>S.users.find(u=>u.id===id)||{id,name:'Someone',avatar:'🌟',color:'#ccc'};
const AVOK=['🌸','🌟','🌙','🕌','🌺','🍀','🌈','🚀','⚽','🎈','🍎','🌻'];const fav=u=>AVOK.includes(u.avatar)?u.avatar:'🌟';
const av=(id,c='')=>{const u=U(id);return `<span class="av ${c} ${S.online.includes(id)?'dotOn':''}" style="background:${u.color}">${fav(u)}</span>`};
const toast=(m,t=2600)=>{const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',t)};
const send=m=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))};
const IN_APK=!!(window.Android&&window.Android.getServer);

function gonni(why){if(why==='rude')toast('Kind words only, please 💛',3000)}

/* ---------- connection ---------- */
function connect(){
  if(!token)return login();
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+token);
  ws.onopen=()=>{wsOk=true;retry=0;$('#conn').style.display='none'};
  ws.onclose=()=>{wsOk=false;if(!token)return;$('#conn').style.display='block';setTimeout(connect,Math.min(5000,1000+retry++*800))};
  ws.onmessage=e=>on(JSON.parse(e.data));
  clearInterval(connect.pi);connect.pi=setInterval(()=>send({t:'ping'}),20000);
}
function on(m){
  switch(m.t){
    case 'init':{me=m.me;const{t,...rest}=m;Object.assign(S,rest);S.typing={};if(!window.__started){window.__started=true;render();maybeAnnounce()}else render();break}
    case 'users':case 'deeds':case 'events':case 'photos':case 'notes':case 'lessons':case 'wazes':{const{t,...rest}=m;Object.assign(S,rest);if(m.t==='users'){me=S.users.find(u=>u.id===me.id)||me}refresh(m.t);break}
    case 'track':S.trk=m.trk;S.trkTotal=m.trkTotal;if(view==='track')render();break;
    case 'track:all':showFamilyTrack(m);break;
    case 'win':S.win=m.win;if(view==='learn'||view==='journey'&&jv.mode==='map')render();break;
    case 'wl':S.wl=m.wl;break;
    case 'locks':S.locks=m.locks;if(view==='note')paintNote();if(view==='notes')render();break;
    case 'chat':S.chat.push(m.m);if(S.chat.length>300)S.chat.shift();if(view==='chat'){addMsg(m.m);send({t:'seen'})}else if(m.m.user!==me.id){S.unread++;if(view==='hub')render()}break;
    case 'chat:del':S.chat=S.chat.filter(x=>x.id!==m.id);if(view==='chat')paintChat();break;
    case 'chat:clear':S.chat=[];if(view==='chat')paintChat();break;
    case 'typing':S.typing[m.u]=Date.now();if(view==='chat')paintTyping();break;
    case 'gonni':gonni(m.why);break;
    case 'wrong':gonni('wrong');shakeEl('#guess');break;
    case 'toast':toast(m.m);break;
    case 'note:opened':openNote=m.id;view='note';render();break;
    case 'cheer':toast(U(m.u).name+' did: '+m.emoji+' '+m.deed+'  +'+m.points+'⭐',3200);break;
    case 'rooms':S.rooms=m.rooms;if(view==='play'&&!S.room)render();break;
    case 'room':{const had=S.room;S.room=m.room;if(view==='play')renderRoom(had);break}
        case 'code':S.code=m.code;break;
    case 'kicked':token=null;try{localStorage.removeItem('cousin_token')}catch(e){}login('You were removed from the family.');break;
  }
}
function refresh(k){
  if(k==='users'&&(view==='hub'||view==='play'&&!S.room))render();
  else if(k==='deeds'&&view==='deeds')render();else if(k==='events'&&(view==='calendar'||view==='hub'))render();
  else if(k==='photos'&&view==='album')render();else if(k==='lessons'&&view==='learn')vLearn();else if(k==='wazes'&&view==='waz'&&!document.querySelector('audio:not([paused])'))render();else if(k==='notes'&&(view==='notes'||view==='note'))view==='note'?paintNote():render();
  if(k==='users'&&view==='chat')paintChat();
}
function shakeEl(s){const e=$(s);if(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}}

/* ---------- login ---------- */
function login(msg){
  $('#hd').innerHTML='';
  $('#main').innerHTML=`<div style="text-align:center;margin:20px 0 8px"><div style="font-size:64px">🏡✨</div><h1 style="margin:4px 0">Cousin Heaven</h1><div class="sub">A safe, happy place for our family cousins</div></div>
  <div class="card"><label>Your name</label><input id="ln" maxlength="20" autocomplete="off" placeholder="e.g. Aisha">
  <label>Secret PIN (4 numbers)</label><input id="lp" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
  <div id="lcw"><label>Family code <span class="sub">(only the first time)</span></label><input id="lc" autocomplete="off" placeholder="Ask your parents"></div>
  <div class="sub" id="lerr" style="color:var(--red);margin-top:8px">${esc(msg||'')}</div>
  <button class="pri" id="lgo" style="width:100%;margin-top:10px;font-size:18px">Let's go! 🚀</button>
  ${IN_APK?'<button class="ghost sm" id="lsrv" style="width:100%;margin-top:6px">Change server</button>':''}</div>`;
  try{const ac=IN_APK&&Android.getCode&&Android.getCode()||new URLSearchParams(location.search).get('c')||'';if(ac){$('#lc').value=ac;$('#lcw').style.display='none'}}catch(e){}
  const go=async()=>{
    const name=$('#ln').value.trim(),pin=$('#lp').value,code=$('#lc').value.trim();
    if(name.length<2||!/^\d{4}$/.test(pin)){$('#lerr').textContent='Please type your name and a 4-number PIN.';shakeEl('.card');return}
    $('#lgo').disabled=true;
    try{const r=await fetch('/api/join',{method:'POST',body:JSON.stringify({name,pin,code})});const j=await r.json();
      if(r.ok){token=j.token;try{localStorage.setItem('cousin_token',token)}catch(e){}window.__started=false;connect()}
      else{const w=j.error==='pin'?'pin':j.error==='code'?'code':null;$('#lerr').textContent=j.error==='pin'?'Wrong PIN for this name.':j.error==='code'?'That family code is not right. (New members need it.)':j.error==='slow'?'Too many tries. Wait a few minutes.':'Please check what you typed.';if(w)gonni(w)}}
    catch(e){$('#lerr').textContent='Cannot reach the server. Check your internet.'}
    $('#lgo').disabled=false};
  $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
  if($('#lsrv'))$('#lsrv').onclick=()=>Android.resetServer();
}

/* ---------- shell ---------- */
const TITLES={hub:'Cousin Heaven ✨',chat:'Family Chat',notes:'Our Notes',note:'Note',deeds:'Good Deeds',album:'Our Album',learn:'Learning Zone',waz:'Listen to Waz',track:'Salah & Quran',journey:'Arabic Journey',calendar:'Special Days',play:'Play Zone'};
function go(v){if(S.room&&view==='play'&&v!=='play'&&S.room.state==='playing'){toast('Finish or leave your game first');return}view=v;if(v==='chat')S.unread=0;render();scrollTo(0,0)}
function render(){
  if(!me)return;clearInterval(stT);
  $('#hd').innerHTML=(view==='hub'?'':'<button class="ghost" id="bk" style="font-size:22px">‹</button>')+`<h1>${TITLES[view]}</h1><button class="ghost" id="pf">${av(me.id)}</button>`;
  if($('#bk'))$('#bk').onclick=()=>{if(view==='note'){send({t:'note:unlock',id:openNote});view='notes'}else if(view==='play'&&S.room){leaveRoom();return}else view='hub';render()};
  $('#pf').onclick=profile;
  ({hub:vHub,chat:vChat,notes:vNotes,note:vNote,deeds:vDeeds,album:vAlbum,learn:vLearn,waz:vWaz,track:vTrack,journey:vJourney,calendar:vCal,play:vPlay}[view]||vHub)();
}
function sheet(html,mount){closeSheet();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div class="sheet">'+html+'</div>';m.onclick=e=>{if(e.target===m)closeSheet()};document.body.appendChild(m);mount&&mount(m)}
function closeSheet(){const m=$('#modal');if(m)m.remove()}
const ago=t=>{const d=new Date(t);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};
const nextOcc=e=>{const t=new Date();t.setHours(0,0,0,0);let d=new Date(e.date+'T00:00:00');if(e.yearly){d.setFullYear(t.getFullYear());if(d<t)d.setFullYear(t.getFullYear()+1)}return Math.round((d-t)/864e5)};

/* ---------- hub ---------- */
function vHub(){
  const ev=S.events.map(e=>({...e,n:nextOcc(e)})).filter(e=>e.n>=0).sort((a,b)=>a.n-b.n)[0];
  const T=[['play','🎮','Play Zone','#8b6cf6'],['chat','💬','Chat','#ff7aa2'],['notes','📝','Our Notes','#2bb8ae'],['deeds','⭐','Good Deeds','#f7b731'],['album','📸','Album','#ef7d57'],['learn','📚','Learning','#4c9be8'],['waz','🎧','Listen to Waz','#3a8f6b'],['track','📿','Salah & Quran','#5b7fe0'],['journey','🗺️','Arabic Journey','#d9822b'],['calendar','🎂','Special Days','#e0679c']];
  const total=S.board.reduce((a,b)=>a+b.pts,0);
  $('#main').innerHTML=`<div class="card row"><div style="font-size:30px">👋</div><div style="flex:1"><b>Assalamu alaikum, ${esc(me.name)}!</b><div class="sub">${S.online.length} cousin${S.online.length==1?'':'s'} online · family stars: ${total} ⭐</div></div></div>
  <div class="row wrap" style="margin-bottom:10px">${S.users.map(u=>av(u.id)).join('')}</div>
  ${ev?`<div class="card" onclick="go('calendar')" style="background:#fff0f6">${ev.type==='birthday'?'🎂':ev.type==='eid'?'🌙':'🏠'} <b>${esc(ev.title)}</b> — ${ev.n===0?'<b>TODAY! 🎉</b>':ev.n===1?'tomorrow':'in '+ev.n+' days'}</div>`:''}
  <div class="tiles">${T.map(t=>`<div class="tile" style="background:${t[3]}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}${t[0]==='chat'&&S.unread?`<span class="badge">${S.unread}</span>`:''}</div>`).join('')}</div>`;
}

/* ---------- chat ---------- */
const STK=['MashaAllah ✨','JazakAllah Khair 💛','InshaAllah','Assalamu alaikum 👋','Ameen 🤲','Let\'s play! 🎮','❤️','🌙'];
function vChat(){
  $('#main').innerHTML=`<div id="msgs"></div><div class="sub" id="typ" style="height:18px"></div><div class="stk">${STK.map(s=>`<button class="sm" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <div class="row"><input id="ci" maxlength="400" placeholder="Write a kind message…" autocomplete="off"><button class="pri" id="cs">Send</button></div>`;
  paintChat();
  const sendIt=()=>{const v=$('#ci').value.trim();if(v){send({t:'chat',text:v});$('#ci').value=''}};
  $('#cs').onclick=sendIt;let lt=0;$('#ci').oninput=()=>{if(Date.now()-lt>1500){lt=Date.now();send({t:'typing'})}};$('#ci').onkeydown=e=>{if(e.key==='Enter')sendIt()};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>send({t:'chat',text:b.dataset.s}));
}
function msgHtml(m){const mine=m.user===me.id;return `<div class="m ${mine?'me':''}" data-id="${m.id}">${av(m.user,'sm')}<div class="bub"><small>${esc(U(m.user).name)} · ${ago(m.created)}${mine||me.role==='admin'?` <a data-del="${m.id}" style="cursor:pointer">✕</a>`:''}</small>${esc(m.text)}</div></div>`}
function paintChat(){const el=$('#msgs');if(!el)return;el.innerHTML=S.chat.length?S.chat.map(msgHtml).join(''):'<div class="sub" style="text-align:center;margin-top:40px">No messages yet. Say Assalamu alaikum! 👋</div>';el.scrollTop=el.scrollHeight;bindDel()}
function addMsg(m){const el=$('#msgs');if(!el)return;if(!S.chat.length||el.querySelector('.sub'))return paintChat();el.insertAdjacentHTML('beforeend',msgHtml(m));el.scrollTop=el.scrollHeight;bindDel()}
function bindDel(){document.querySelectorAll('[data-del]').forEach(a=>a.onclick=()=>send({t:'chat:del',id:+a.dataset.del}))}
function paintTyping(){const el=$('#typ');if(!el)return;const n=Object.entries(S.typing).filter(([u,t])=>+u!==me.id&&Date.now()-t<3000).map(([u])=>U(+u).name);el.textContent=n.length?n.join(', ')+' is typing…':'';setTimeout(paintTyping,3200)}

/* ---------- notes ---------- */
function vNotes(){
  $('#main').innerHTML=`<button class="pri" id="nn" style="width:100%;margin-bottom:10px">＋ New note</button>`+(S.notes.length?S.notes.map(n=>`<div class="card" data-n="${n.id}"><div class="row sp"><b>${esc(n.title)}</b>${S.locks[n.id]&&S.locks[n.id]!==me.id?`<span class="pill">✍️ ${esc(U(S.locks[n.id]).name)}</span>`:''}</div><div class="sub">${esc((n.body||'').slice(0,90))||'Empty note'}</div><div class="sub" style="margin-top:4px">Last edit: ${esc(U(n.by).name)}</div></div>`).join(''):'<div class="sub" style="text-align:center;margin-top:30px">No notes yet. Start one together! ✍️</div>');
  $('#nn').onclick=()=>sheet(`<h3>New note</h3><input id="nt" maxlength="60" placeholder="Title (e.g. Eid plans)"><div class="row" style="margin-top:12px;justify-content:flex-end"><button onclick="closeSheet()">Cancel</button><button class="pri" id="nok">Create</button></div>`,()=>{$('#nok').onclick=()=>{send({t:'note:new',title:$('#nt').value});closeSheet()}});
  document.querySelectorAll('[data-n]').forEach(c=>c.onclick=()=>{openNote=+c.dataset.n;view='note';render()});
}
let noteDirty=null,hbT=null;
function vNote(){
  const n=S.notes.find(x=>x.id===openNote);if(!n){view='notes';return render()}
  $('#main').innerHTML=`<div id="nb" class="sub" style="min-height:22px"></div><input id="ntt" maxlength="60" value="${esc(n.title)}" style="font-weight:800;margin-bottom:8px"><textarea id="nbody" placeholder="Write together here…">${esc(n.body||'')}</textarea><div class="row sp" style="margin-top:8px"><span class="sub" id="nst"></span><button class="sm" id="ndel">🗑 Delete</button></div>`;
  const body=$('#nbody'),tt=$('#ntt');
  const save=()=>{send({t:'note:save',id:openNote,title:tt.value,body:body.value});const st=$('#nst');if(st)st.textContent='Saved ✓'};
  const edited=()=>{send({t:'note:lock',id:openNote});const st=$('#nst');if(st)st.textContent='Saving…';clearTimeout(noteDirty);noteDirty=setTimeout(save,700);clearInterval(hbT);hbT=setInterval(()=>{if(document.activeElement===body||document.activeElement===tt)send({t:'note:lock',id:openNote});else clearInterval(hbT)},4000)};
  body.oninput=tt.oninput=edited;
  const rel=()=>setTimeout(()=>{if(document.activeElement!==body&&document.activeElement!==tt){clearTimeout(noteDirty);save();send({t:'note:unlock',id:openNote});clearInterval(hbT)}},200);
  body.onblur=tt.onblur=rel;

async function upl(e){
  const files=[...e.target.files];e.target.value='';let n=0,bad='';if(!files.length)return;toast('Selected '+files.length+' photo'+(files.length>1?'s':'')+'…',1500);
  for(const f of files){try{
    let b;try{b=await shrink(f)}catch(x){b=f}
    const al=encodeURIComponent(($('#pa')||{}).value||'Everyday'),cp=encodeURIComponent(($('#pc')||{}).value||'');
    if($('#pst'))$('#pst').textContent='Uploading '+(n+1)+' of '+files.length+'…';
    const r=await fetch('/api/photos?album='+al+'&caption='+cp,{method:'POST',headers:{'x-token':token,'content-type':b.type&&/jpeg|png|webp/.test(b.type)?b.type:'image/jpeg'},body:b});
    if(!r.ok)throw new Error('server said '+r.status);n++}catch(x){bad=String(x&&x.message||x)}}
  if(bad)toast('Photo problem: '+bad,5000);else{closeSheet();toast('Photos added! 📸')}
}
function shrink(f){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.82)};im.onerror=no;im.src=URL.createObjectURL(f)})}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lastDays=n=>Array.from({length:n},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(n-1-i));return ymd(d)});
const bitc=n=>[0,1,2,3,4].filter(i=>n&(1<<i)).length;
function trRow(day){return S.trk.find(r=>r.day===day)||{day,salah:0,pages:0}}
function vTrack(){
  const days=lastDays(7),td=days[6];if(!trDay||!days.includes(trDay))trDay=td;
  const r=trRow(trDay),dn=d=>d===td?'Today':new Date(d+'T00:00:00').toLocaleDateString([],{weekday:'short'});
  // streak of days with all five prayers
  let streak=0;{const set={};S.trk.forEach(x=>set[x.day]=x);let d=new Date();if(bitc((set[ymd(d)]||{salah:0}).salah)<5)d.setDate(d.getDate()-1);while(set[ymd(d)]&&bitc(set[ymd(d)].salah)===5){streak++;d.setDate(d.getDate()-1)}}

  <div class="sub" style="margin-top:6px">${streak?'🔥 '+streak+' day'+(streak>1?'s':'')+' with all 5 prayers in a row':'Pray all 5 to start a streak'}</div></div>

  <div class="bar" style="margin-top:14px"><i style="width:${prog}%"></i></div><div class="sub" style="margin-top:4px">${S.trkTotal} pages in total · ${khatam?khatam+' khatam'+(khatam>1?'s':'')+' 🎉 · ':''}604 pages = one full Quran</div></div>

  <div class="sub" style="text-align:center">🔒 This is between you and Allah. Only parents can see a summary.</div>
  ${me.role==='admin'?'<button style="width:100%;margin-top:10px" id="tfam">👨‍👩‍👧 Family overview (parents)</button>':''}`;
  const save=(salah,pages)=>send({t:'track:set',day:trDay,salah,pages});
  document.querySelectorAll('[data-d]').forEach(c=>c.onclick=()=>{trDay=c.dataset.d;vTrack()});

}

const JSTAGES=[],JW={};
(()=>{JCATS.forEach(c=>{const n=Math.ceil(c.w.length/10),sz=Math.ceil(c.w.length/n);for(let p=0;p<n;p++){const ids=[];c.w.slice(p*sz,p*sz+sz).forEach((w,k)=>{const id=c.id+':'+(p*sz+k);JW[id]={id,ar:w[0],tr:w[1],en:w[2],sym:w[3],cat:c.id};ids.push(id)});JSTAGES.push({t:c.t+(n>1?' '+(p+1):''),e:c.e,c:c.c,ids})}});
  const n=Math.ceil(JQW.length/10),sz=Math.ceil(JQW.length/n);for(let p=0;p<n;p++){const ids=[];JQW.slice(p*sz,p*sz+sz).forEach((w,k)=>{const id='q:'+(p*sz+k);JW[id]={id,ar:w[0],tr:w[1],en:w[2],sym:'📖',cat:'q',from:w[3]};ids.push(id)});JSTAGES.push({t:'Quran Words '+(p+1),e:'📖',c:'#2bb8ae',ids})}})();
let jv={mode:'map'};
const wlSet=()=>new Set(S.wl||[]);
const stageDone=(st,L)=>st.ids.every(i=>L.has(i));
function vJourney(){
  const L=wlSet(),W=S.win||{cur:{board:[],words:[]},last:{words:[],hit:[]},target:15};
  if(jv.mode==='study'){const st=JSTAGES[jv.i];$('#main').innerHTML=`<button class="sm" id="jb" style="margin-bottom:10px">‹ Journey</button><div class="card"><b>${st.e} ${st.t}</b><div class="sub">Read the words, then take the quiz.</div></div>${st.ids.map(i=>{const w=JW[i];return `<div class="card row"><div class="ar-w" style="font-family:'Noto Naskh Arabic','Amiri',serif;font-size:30px;min-width:120px;text-align:center;direction:rtl">${w.ar}</div><div style="flex:1"><b>${esc(w.en)}</b><div class="sub">${esc(w.tr)}${w.from?' · '+esc(w.from):''}</div></div>${L.has(i)?'✅':''}</div>`}).join('')}<button class="pri" style="width:100%" id="jq">🎯 Start the quiz</button>`;$('#jb').onclick=()=>{jv={mode:'map'};vJourney()};$('#jq').onclick=()=>{startQuiz(jv.i)};return}
  if(jv.mode==='quiz'){drawJQ();return}
  const me_=(W.cur.board||[]).find(x=>x.id===me.id),mine=me_?me_.v:0,T=W.target||15,board=W.cur.board||[],mx=Math.max(1,T,...board.map(b=>b.v));
  const done=JSTAGES.filter(st=>stageDone(st,L)).length;let firstOpen=JSTAGES.findIndex(st=>!stageDone(st,L));
  $('#main').innerHTML=`<div class="card"><div class="row sp"><b>🎯 Weekly target</b><span class="pill">${mine} / ${T} words</span></div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,mine/T*100)}%"></i></div><div class="sub" style="margin-top:4px">${mine>=T?'🎉 Target reached! MashaAllah!':'Learn '+(T-mine)+' more word'+(T-mine==1?'':'s')+' by Friday'}${me.role==='admin'?' · <a id="jt" style="text-decoration:underline;cursor:pointer">change target</a>':''}</div></div>
  <div class="card"><b>🏆 This week</b>${board.length?board.map((b,k)=>`<div class="lb"><span style="width:20px">${k+1}</span>${av(b.id,'sm')}<div style="flex:1"><div class="bar"><i style="width:${b.v/mx*100}%"></i></div></div><b>${b.v}</b>${b.v>=T?'🎯':''}</div>`).join(''):'<div class="sub">Nobody has learned a word yet this week. Be the first!</div>'}
  ${W.last.words.length?`<div class="sub" style="margin-top:8px">Last week's winner: ${wnames(W.last.words)} (${W.last.words[0].v} words)${W.last.hit.length?' · 🎯 reached the target: '+W.last.hit.map(x=>esc(x.name)).join(', '):''}</div>`:''}</div>
  <div class="sub" style="margin:4px 2px 8px">Journey: ${done} of ${JSTAGES.length} stages · ${L.size} words learned</div>
  ${JSTAGES.map((st,i)=>{const dn=stageDone(st,L),open=i<=firstOpen||dn,cnt=st.ids.filter(x=>L.has(x)).length;return `<div class="card row" data-s="${i}" style="${open?'cursor:pointer':'opacity:.55'};border-left:8px solid ${st.c}"><div style="font-size:30px">${open?st.e:'🔒'}</div><div style="flex:1"><b>${st.t}</b><div class="sub">${cnt} / ${st.ids.length} words</div></div>${dn?'⭐':open?'▶':''}</div>`}).join('')}`;
  document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{const i=+e.dataset.s;if(i>firstOpen&&!stageDone(JSTAGES[i],L)){toast('Finish the earlier stages first 🔒');return}jv={mode:'study',i};vJourney()});
  if($('#jt'))$('#jt').onclick=()=>sheet(`<h3>Weekly target</h3><div class="sub">How many new words each cousin should learn per week?</div><input id="jn" type="number" min="3" max="100" value="${T}" style="margin-top:10px"><div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeSheet()">Cancel</button><button class="pri" id="jok">Save</button></div>`,()=>$('#jok').onclick=()=>{send({t:'journey:target',n:+$('#jn').value});closeSheet()});
}
function startQuiz(i){
  const L=wlSet(),st=JSTAGES[i],q=st.ids.filter(x=>!L.has(x));
  if(!q.length){toast('Stage already complete ⭐');jv={mode:'map'};vJourney();return}
  jv={mode:'quiz',i,queue:shuf(q),ans:-1,got:0,total:q.length,opts:null};drawJQ();
}
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function drawJQ(){
  const st=JSTAGES[jv.i];
  if(!jv.queue.length){$('#main').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:64px">🌟</div><h2>Stage complete!</h2><div class="sub">${jv.got} new word${jv.got==1?'':'s'} learned. MashaAllah!</div></div><button class="pri" style="width:100%" id="jd">Continue the journey</button>`;$('#jd').onclick=()=>{jv={mode:'map'};vJourney()};return}
  const id=jv.queue[0],w=JW[id];
  if(!jv.opts){const same=Object.values(JW).filter(x=>x.id!==id&&x.en!==w.en),pool=shuf(same.filter(x=>x.cat===w.cat)).concat(shuf(same));const seen=new Set([w.en]),wr=[];for(const x of pool){if(!seen.has(x.en)){seen.add(x.en);wr.push(x)}if(wr.length===3)break}jv.opts=shuf([w,...wr])}
  $('#main').innerHTML=`<div class="row sp" style="margin-bottom:8px"><span class="sub">${st.e} ${st.t}</span><span class="pill">${jv.queue.length} left</span></div><div class="card" style="text-align:center"><div class="sub">What does this word mean?</div><div style="font-family:'Noto Naskh Arabic','Amiri',serif;font-size:56px;direction:rtl;line-height:1.7">${w.ar}</div><div class="sub">${esc(w.tr)}</div></div>
  ${jv.opts.map((o,k)=>`<button style="display:block;width:100%;margin:8px 0;padding:14px;font-size:18px;${jv.ans>=0?(o.id===id?'background:#c8f7d4;border-color:#34c759':jv.ans===k?'background:#ffd6d6;border-color:#ef5350':''):''}" data-o="${k}" ${jv.ans>=0?'disabled':''}>${esc(o.en)}</button>`).join('')}<button class="sm" id="jx" style="margin-top:8px">Stop</button>`;
  $('#jx').onclick=()=>{jv={mode:'map'};vJourney()};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const k=+b.dataset.o;jv.ans=k;const ok=jv.opts[k].id===id;drawJQ();setTimeout(()=>{if(jv.mode!=='quiz')return;if(ok){jv.queue.shift();jv.got++;send({t:'word:learn',id})}else{jv.queue.push(jv.queue.shift())}jv.ans=-1;jv.opts=null;drawJQ()},ok?700:1300)});
}

const AEXT={'audio/mpeg':'mp3','audio/mp3':'mp3','audio/mp4':'m4a','audio/x-m4a':'m4a','audio/m4a':'m4a','audio/aac':'aac','audio/ogg':'ogg','audio/wav':'wav','audio/x-wav':'wav','audio/webm':'webm'};
function vWaz(){
  const L=S.wazes,mb=n=>(n/1048576).toFixed(1)+' MB';
  $('#main').innerHTML=(me.role==='admin'?'<button class="pri" id="wadd" style="width:100%;margin-bottom:10px">＋ Upload a waz (audio file)</button>':'')+
  (L.length?L.map(w=>`<div class="card"><div class="row sp"><b>🎧 ${esc(w.title)}</b>${me.role==='admin'?`<a class="sub" data-wd="${w.id}" style="cursor:pointer">remove</a>`:''}</div><div class="sub">${new Date(w.created).toLocaleDateString()} · ${mb(w.size)}</div><audio controls preload="none" style="width:100%;margin-top:8px" src="/audio/${w.file}?t=${token}"></audio></div>`).join(''):'<div class="sub" style="text-align:center;margin-top:30px">No waz yet. A parent can upload one 🎧</div>');
  document.querySelectorAll('[data-wd]').forEach(a=>a.onclick=()=>{if(confirm('Remove this waz?'))send({t:'waz:del',id:+a.dataset.wd})});
  if($('#wadd'))$('#wadd').onclick=()=>sheet(`<h3>Upload a waz</h3><label>Title</label><input id="wt" maxlength="80" placeholder="e.g. Kindness to parents"><label>Audio file (mp3, m4a, wav, ogg)</label><input type="file" id="wf" accept="audio/*,.mp3,.m4a,.aac,.ogg,.wav,.opus"><div class="bar" style="margin-top:12px"><i id="wbar" style="width:0"></i></div><div class="sub" id="wst" style="margin:6px 0">Large files may take a few minutes. Keep the app open.</div><div class="row" style="justify-content:flex-end"><button onclick="closeSheet()">Close</button><button class="pri" id="wgo">Upload</button></div>`,()=>{
    $('#wgo').onclick=()=>{const f=$('#wf').files[0];if(!f){$('#wst').textContent='Please choose an audio file first.';return}
      let ext=(f.name.split('.').pop()||'').toLowerCase();if(!/^(mp3|m4a|aac|ogg|wav|opus|webm)$/.test(ext))ext=AEXT[f.type]||'';
      if(!ext){$('#wst').textContent='This file type is not supported. Use mp3, m4a, wav or ogg.';return}
      if(f.size>150e6){$('#wst').textContent='File is too big (max 150 MB).';return}
      const t=$('#wt').value.trim()||f.name.replace(/\.[^.]+$/,'');$('#wgo').disabled=true;
      const x=new XMLHttpRequest();x.open('POST','/api/waz?ext='+ext+'&title='+encodeURIComponent(t));x.setRequestHeader('x-token',token);
      x.upload.onprogress=e=>{if(e.lengthComputable){$('#wbar').style.width=(e.loaded/e.total*100)+'%';$('#wst').textContent='Uploading… '+Math.round(e.loaded/e.total*100)+'%'}};
      x.onload=()=>{if(x.status===200){closeSheet();toast('Waz uploaded 🎧')}else{$('#wgo').disabled=false;$('#wst').textContent='Upload failed (error '+x.status+').'}};
      x.onerror=()=>{$('#wgo').disabled=false;$('#wst').textContent='Upload failed. Check your internet and try again.'};x.send(f)}});
}

  setTimeout(()=>sheet(`<div style="text-align:center"><div style="font-size:56px">🏆</div><h2 style="margin:4px 0">Last week's winners!</h2>
  ${W.last.quran.length?`<div class="card" style="margin-top:10px"><div class="sub">📖 Most Quran read</div><div style="font-size:19px;margin-top:4px">${wnames(W.last.quran)}</div><div class="sub">${W.last.quran[0].v} pages</div></div>`:''}
  ${W.last.words&&W.last.words.length?`<div class="card"><div class="sub">🗺️ Most Arabic words learned</div><div style="font-size:19px;margin-top:4px">${wnames(W.last.words)}</div><div class="sub">${W.last.words[0].v} words${W.last.hit.length?' · 🎯 target reached by '+W.last.hit.map(x=>esc(x.name)).join(', '):''}</div></div>`:''}
  ${W.last.study.length?`<div class="card"><div class="sub">⏱ Most study time</div><div style="font-size:19px;margin-top:4px">${wnames(W.last.study)}</div><div class="sub">${fmtMin(W.last.study[0].v)}</div></div>`:''}
  <div style="font-size:26px">🎉🌟🎉</div><div class="sub">MashaAllah! A new week starts today.</div><button class="pri" style="width:100%;margin-top:10px" onclick="closeSheet()">Alhamdulillah!</button></div>`),600);
}
function vLearn(){
  if(openLesson){const l=S.lessons.find(x=>x.id===openLesson);if(l){const k=LK[l.kind]||LK.lesson;
    $('#main').innerHTML=`<button class="sm" id="lb" style="margin-bottom:10px">‹ Back</button><div class="card"><div class="sub">${k[0]} ${k[1]}</div><h2 style="margin:4px 0 10px">${esc(l.title)}</h2><div style="white-space:pre-wrap;font-size:18px;line-height:1.6">${esc(l.body)}</div></div>
    ${l.kind==='writing'?'<button class="pri" id="la" style="width:100%">✍️ Write my answer in Our Notes</button>':''}${me.role==='admin'?'<button class="sm" id="ld" style="margin-top:10px">🗑 Delete this</button>':''}`;
    $('#lb').onclick=()=>{openLesson=null;vLearn()};
    if($('#la'))$('#la').onclick=()=>send({t:'note:new',title:'My answer: '+l.title.slice(0,40)});
    if($('#ld'))$('#ld').onclick=()=>sheet(`<h3>Delete this lesson?</h3><div class="row" style="justify-content:flex-end"><button onclick="closeSheet()">Cancel</button><button class="pri" id="ldy">Delete</button></div>`,()=>$('#ldy').onclick=()=>{send({t:'lesson:del',id:l.id});openLesson=null;closeSheet();vLearn()});return}openLesson=null}
  const L=S.lessons,td=ymd(new Date()),wkM=lastDays(7).reduce((a,d)=>a+(trRow(d).mins||0),0),W=S.win;
  let st=0;try{st=+localStorage.getItem('ch_study_start')||0}catch(e){}
  const win=W&&(W.last.quran.length||W.last.study.length||W.cur.quran.length||W.cur.study.length);
  $('#main').innerHTML=`<div class="card"><div class="row sp"><b>⏱ Study time</b><span class="sub">Today ${fmtMin(trRow(td).mins||0)} · Week ${fmtMin(wkM)}</span></div>
  ${st?`<div style="text-align:center;font-size:42px;font-weight:800;margin:10px 0" id="stt">0:00</div><button class="pri" style="width:100%" id="sstop">⏹ Stop &amp; save</button>`:`<button class="pri" style="width:100%;margin-top:10px;font-size:18px" id="sgo">▶ Start studying</button><div class="row" style="justify-content:center;margin-top:8px"><span class="sub">or add:</span><button class="sm" data-m="10">+10 min</button><button class="sm" data-m="20">+20 min</button><button class="sm" data-m="30">+30 min</button></div>`}</div>
  ${win?`<div class="card"><b>🏆 Weekly winners</b>${W.last.quran.length||W.last.study.length?`<div class="sub" style="margin-top:6px">Last week</div>${W.last.quran.length?`<div>📖 ${wnames(W.last.quran)} <span class="sub">${W.last.quran[0].v} pages</span></div>`:''}${W.last.study.length?`<div>⏱ ${wnames(W.last.study)} <span class="sub">${fmtMin(W.last.study[0].v)}</span></div>`:''}`:''}${W.cur.quran.length||W.cur.study.length?`<div class="sub" style="margin-top:8px">Leading this week</div>${W.cur.quran.length?`<div>📖 ${wnames(W.cur.quran)}</div>`:''}${W.cur.study.length?`<div>⏱ ${wnames(W.cur.study)}</div>`:''}`:''}<div class="sub" style="margin-top:6px">Week runs Saturday to Friday. Winners are announced every Saturday.</div></div>`:''}
  <div class="row sp"><h2 style="margin:6px 0">From Papa 💌</h2>${me.role==='admin'?'<button class="pri sm" id="la">＋ Add</button>':''}</div>
  ${L.length?L.map(l=>{const k=LK[l.kind]||LK.lesson;return `<div class="card row" data-ls="${l.id}" style="cursor:pointer"><div style="font-size:32px">${k[0]}</div><div style="flex:1"><b>${esc(l.title)}</b><div class="sub">${k[1]}</div></div>›</div>`}).join(''):'<div class="sub" style="text-align:center;margin:20px 0">No lessons yet. Papa will add some soon 💌</div>'}`;
  document.querySelectorAll('[data-ls]').forEach(c=>c.onclick=()=>{openLesson=+c.dataset.ls;vLearn()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{send({t:'study:add',mins:+b.dataset.m});toast('Study time saved ⏱')});
  if($('#sgo'))$('#sgo').onclick=()=>{try{localStorage.setItem('ch_study_start',Date.now())}catch(e){}vLearn()};
  if(st){const tick=()=>{const e=$('#stt');if(!e){clearInterval(stT);return}const s=Math.floor((Date.now()-st)/1000);e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};tick();clearInterval(stT);stT=setInterval(tick,1000)}
  if($('#sstop'))$('#sstop').onclick=()=>{const m=Math.round((Date.now()-st)/60000);try{localStorage.removeItem('ch_study_start')}catch(e){}clearInterval(stT);if(m<1){toast('Study for at least 1 minute to save it');vLearn();return}let left=m;while(left>0){const c=Math.min(180,left);send({t:'study:add',mins:c});left-=c}toast('MashaAllah! '+fmtMin(m)+' saved ⭐');vLearn()};
  if($('#la'))$('#la').onclick=()=>{let kind='story';sheet(`<h3>New for the kids</h3><label>Type</label><div class="row wrap" id="lk">${Object.entries(LK).map(([k,v])=>`<button class="sm ${k==='story'?'pri':''}" data-k="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>
    <label>Title</label><input id="lt" maxlength="80" placeholder="e.g. The honest shepherd"><label>Text</label><textarea id="lbd" style="min-height:30vh" placeholder="Write the story, the writing task or the lesson here…"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button onclick="closeSheet()">Cancel</button><button class="pri" id="lok">Share</button></div>`,m=>{
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{kind=b.dataset.k;m.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('pri',x===b))});
    $('#lok').onclick=()=>{const t=$('#lt').value.trim(),b=$('#lbd').value.trim();if(!t||!b)return;send({t:'lesson:add',kind,title:t,body:b});closeSheet();toast('Shared with the cousins 💌')}})};
}
/* ---------- play zone ---------- */
const GINFO={quiz:['🎯','Quiz Race','Answer Islamic questions faster than your cousins!'],memory:['🧠','Memory Match','Take turns finding matching pairs.'],dots:['🔷','Dots & Boxes','Draw lines and close boxes to win them.'],scramble:['🔤','Word Scramble','Unscramble Islamic words. Fastest wins!']};
function vPlay(){
  if(S.room){renderRoom(null);return}
  const open=S.rooms.filter(r=>r.state==='lobby');
  $('#main').innerHTML=`<div class="sub" style="margin-bottom:8px">All games are for 2–4 cousins and are free of chance-devices — just skill and fun. 🌟</div>
  ${open.length?`<h2>Open rooms — join now!</h2>${open.map(r=>`<div class="card row"><div style="font-size:30px">${GINFO[r.game][0]}</div><div style="flex:1"><b>${GINFO[r.game][1]}</b><div class="sub">${esc(U(r.host).name)}'s room · ${r.count}/${r.max}</div></div><button class="teal" data-j="${r.id}" ${r.count>=r.max?'disabled':''}>Join</button></div>`).join('')}`:''}
  <h2>Start a game</h2>${Object.keys(GINFO).map(g=>`<div class="card gc"><b class="e">${GINFO[g][0]}</b><div style="flex:1"><b>${GINFO[g][1]}</b><div class="sub">${GINFO[g][2]}</div><div class="sub">${(S.games[g]||{}).min||2}–${(S.games[g]||{}).max||4} players</div></div><button class="pri" data-c="${g}">Create</button></div>`).join('')}`;
  document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>send({t:'g:join',id:b.dataset.j}));
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send({t:'g:create',game:b.dataset.c}));
}
function leaveRoom(){const r=S.room;if(r&&r.state==='playing'){sheet(`<h3>Leave the game?</h3><div class="sub">The other cousins are still playing.</div><div class="row" style="justify-content:flex-end;margin-top:10px"><button onclick="closeSheet()">Stay</button><button class="pri" id="lyes">Leave</button></div>`,()=>$('#lyes').onclick=()=>{closeSheet();send({t:'g:leave'})});return}send({t:'g:leave'})}
function scoreBar(r,turn){return `<div class="score" style="margin-bottom:10px">${r.players.map(p=>`<div class="card ${turn===p?'turn':''}">${av(p,'sm')}<div class="sub">${esc(U(p).name)}</div><b>${r.scores[p]||0}</b></div>`).join('')}</div>`}
function renderRoom(prev){
  const r=S.room;if(!r){render();return}
  if(view!=='play')return;
  const same=prev&&prev.game===r.game&&prev.state===r.state&&r.state==='playing';
  if(r.state==='lobby'||r.state==='over'){
    $('#main').innerHTML=`<div class="card" style="text-align:center"><div style="font-size:50px">${GINFO[r.game][0]}</div><h2 style="margin:4px 0">${GINFO[r.game][1]}</h2><div class="sub">${GINFO[r.game][2]}</div></div>
    ${r.state==='over'?`<div class="card" style="text-align:center;background:#fff7d6"><h2 style="margin:0">${esc(r.msg||'Game over!')}</h2></div>${scoreBar(r)}`:''}
    <div class="card"><b>Players (${r.players.length}/${r.max})</b><div class="row wrap" style="margin-top:8px">${r.players.map(p=>`<div style="text-align:center">${av(p,'lg')}<div class="sub">${esc(U(p).name)}${p===r.host?' 👑':''}</div></div>`).join('')}</div></div>
    ${r.host===me.id?`<button class="pri" id="gs" style="width:100%;font-size:18px" ${r.players.length<r.min&&r.state==='lobby'?'disabled':''}>${r.state==='over'?'Play again':'Start game'}</button>${r.players.length<r.min&&r.state==='lobby'?`<div class="sub" style="text-align:center;margin-top:6px">Waiting for more cousins… (need ${r.min})</div>`:''}`:`<div class="sub" style="text-align:center">${r.state==='over'?'Waiting for the host to restart…':'Waiting for the host to start…'}</div>`}
    <button style="width:100%;margin-top:10px" id="gl">Leave room</button>`;
    if($('#gs'))$('#gs').onclick=()=>send({t:r.state==='over'?'g:again':'g:start'});
    $('#gl').onclick=()=>send({t:'g:leave'});
    return}
  ({quiz:gQuiz,memory:gMemory,dots:gDots,scramble:gScramble}[r.game])(r,same);
}
let qT=null;
function gQuiz(r){
  const q=r.q;if(!q||!q.text)return;const mine=q.mine;
  $('#main').innerHTML=`${scoreBar(r)}<div class="card"><div class="row sp"><span class="pill">Question ${q.i+1}/${q.n}</span><span class="pill" id="qt">⏱ ${q.left}</span></div><h2 style="font-size:20px">${esc(q.text)}</h2>
  ${q.opts.map((o,i)=>`<button class="opt ${q.reveal?(i===q.correct?'ok':(mine===i?'bad':'')):(mine===i?'mine':'')}" data-o="${i}" ${mine>=0||q.reveal?'disabled':''}>${esc(o)} ${q.reveal?Object.entries(q.picks||{}).filter(([u,c])=>c===i).map(([u])=>fav(U(+u))).join(''):''}</button>`).join('')}
  <div class="sub">${q.reveal?(mine===q.correct?'✅ Correct!':mine>=0?'❌ Not this time':'⏰ Time is up'):mine>=0?'Waiting for cousins… ('+q.answered.length+'/'+r.players.length+')':'Pick your answer!'}</div></div><button class="sm" id="gl">Leave</button>`;
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>send({t:'g:act',a:'ans',c:+b.dataset.o}));$('#gl').onclick=leaveRoom;
  clearInterval(qT);if(!q.reveal){let l=q.left;qT=setInterval(()=>{l--;const e=$('#qt');if(e)e.textContent='⏱ '+Math.max(0,l);if(l<=0)clearInterval(qT)},1000)}
  else if(mine!==q.correct&&Math.random()<.4)gonni('wrong');
}
function gMemory(r){
  const m=r.m;$('#main').innerHTML=`${scoreBar(r,m.turn)}<div class="sub" style="text-align:center;margin-bottom:8px">${m.turn===me.id?'<b>Your turn!</b> Flip two cards.':esc(U(m.turn).name)+'\'s turn…'}</div><div class="mem">${m.cards.map((c,i)=>`<button class="mc ${m.matched[i]?'got':c?'up':''}" data-i="${i}">${c||'?'}</button>`).join('')}</div><button class="sm" id="gl" style="margin-top:12px">Leave</button>`;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>send({t:'g:act',a:'flip',i:+b.dataset.i}));$('#gl').onclick=leaveRoom;
}
function gDots(r){
  const d=r.dt,P=50,O=25;let s='';
  for(let i=0;i<5;i++)for(let j=0;j<5;j++){const o=d.box[i][j];if(o!==-1)s+=`<rect x="${O+j*P+3}" y="${O+i*P+3}" width="${P-6}" height="${P-6}" rx="6" fill="${U(o).color}" opacity=".85"/><text x="${O+j*P+P/2}" y="${O+i*P+P/2+7}" font-size="20" text-anchor="middle">${fav(U(o))}</text>`}
  const edge=(k,i,j)=>{const taken=(k==='h'?d.h:d.v)[i][j],x1=O+j*P,y1=O+i*P,x2=k==='h'?x1+P:x1,y2=k==='h'?y1:y1+P;return taken!==-1?`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${U(taken).color}" stroke-width="6" stroke-linecap="round"/>`:`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#e5d8c0" stroke-width="3" stroke-linecap="round"/><line data-k="${k}" data-r="${i}" data-c="${j}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="transparent" stroke-width="22" style="cursor:pointer"/>`};
  for(let i=0;i<6;i++)for(let j=0;j<5;j++)s+=edge('h',i,j);for(let i=0;i<5;i++)for(let j=0;j<6;j++)s+=edge('v',i,j);
  for(let i=0;i<6;i++)for(let j=0;j<6;j++)s+=`<circle cx="${O+j*P}" cy="${O+i*P}" r="5" fill="#3b2a4a"/>`;
  $('#main').innerHTML=`${scoreBar(r,d.turn)}<div class="sub" style="text-align:center;margin-bottom:6px">${d.turn===me.id?'<b>Your turn!</b> Tap a line.':esc(U(d.turn).name)+'\'s turn…'}</div><div class="card"><svg viewBox="0 0 300 300" style="width:100%">${s}</svg></div><button class="sm" id="gl">Leave</button>`;
  document.querySelectorAll('[data-k]').forEach(l=>l.onclick=()=>send({t:'g:act',a:'edge',k:l.dataset.k,r:+l.dataset.r,c:+l.dataset.c}));$('#gl').onclick=leaveRoom;
}
function gScramble(r){
  const s=r.s;$('#main').innerHTML=`${scoreBar(r)}<div class="card" style="text-align:center"><div class="row sp"><span class="pill">Word ${s.i+1}/${s.n}</span><span class="pill" id="qt">⏱ ${s.left}</span></div>
  <div style="margin:12px 0">${(s.reveal?s.answer.split(''):s.letters).map(l=>`<span class="tile2">${l}</span>`).join('')}</div><div><b>${esc(s.clue)}</b></div><div class="sub">${esc(s.hint)}</div>
  ${s.reveal?`<h2>${s.solver?U(s.solver).avatar+' '+esc(U(s.solver).name)+' got it! 🎉':'⏰ Time is up!'}</h2>`:`<div class="row" style="margin-top:10px"><input id="guess" autocomplete="off" autocapitalize="characters" placeholder="Type the word"><button class="pri" id="gg">Go</button></div>`}</div><button class="sm" id="gl">Leave</button>`;
  const g=()=>{const v=$('#guess').value.trim();if(v){send({t:'g:act',a:'guess',w:v});$('#guess').value=''}};
  if($('#gg')){$('#gg').onclick=g;$('#guess').onkeydown=e=>{if(e.key==='Enter')g()};if(document.hasFocus())$('#guess').focus()}$('#gl').onclick=leaveRoom;
  clearInterval(qT);if(!s.reveal){let l=s.left;qT=setInterval(()=>{l--;const e=$('#qt');if(e)e.textContent='⏱ '+Math.max(0,l);if(l<=0)clearInterval(qT)},1000)}
}
connect();
</script></body></html>
