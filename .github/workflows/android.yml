name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        run: gradle :app:assembleDebug :akhirah:assembleDebug :drawrec:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Planora-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Planora.apk
          cp akhirah/build/outputs/apk/debug/akhirah-debug.apk LifeApp.apk
          cp drawrec/build/outputs/apk/debug/drawrec-debug.apk BoardRecorder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeApp-debug-apk
          path: LifeApp.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BoardRecorder-debug-apk
          path: BoardRecorder.apk
      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Planora (latest APK)
          files: |
            Planora.apk
            LifeApp.apk
            BoardRecorder.apk
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
