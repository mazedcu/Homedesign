<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Life App</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#0e1a16;--card:#162821;--card2:#1d3329;--ink:#eef3ee;--mut:#93a79c;--gold:#d9b45a;--grn:#4fbf8a;--red:#e2685f;--line:#2a4337}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:19px;margin:0;color:var(--gold);letter-spacing:.3px}
h2{font-size:16px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.big{font-size:26px;font-weight:700}
button{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;cursor:pointer}
button.pri{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:700}
button.ghost{background:none;border:none;color:var(--mut);padding:6px}
button.dng{color:var(--red)}
button.sm{padding:5px 10px;font-size:13px;border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b1511ee;backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;background:none;border:none;color:var(--mut);font-size:11px;padding:6px 2px;border-radius:10px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--gold)}
.bar{height:8px;border-radius:6px;background:#0b1511;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--gold));border-radius:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.pill.g{color:var(--grn)}.pill.r{color:var(--red)}.pill.y{color:var(--gold)}
.pr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pr:first-of-type{border-top:none}
.seg{display:flex;gap:6px}.seg button{padding:7px 10px;font-size:13px}
.seg .j{background:var(--grn);color:#052015;border-color:var(--grn)}.seg .a{background:#6fa8dc;color:#06182a;border-color:#6fa8dc}.seg .q{background:var(--gold);color:#1b1608;border-color:var(--gold)}
.week{display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;font-size:11px;align-items:center;text-align:center;color:var(--mut)}
.dot{height:18px;border-radius:6px;background:#0b1511}.dot.j{background:var(--grn)}.dot.a{background:#6fa8dc}.dot.q{background:var(--gold)}
.ms{margin:8px 0 0 6px;padding-left:10px;border-left:2px solid var(--line)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.chk input{width:19px;height:19px;accent-color:var(--grn);margin-top:1px;flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.chk span{flex:1}
.dim{color:var(--mut)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:90vh;overflow:auto;border:1px solid var(--line)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;background:#0b1511;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:64px;resize:vertical}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);width:54px;height:54px;border-radius:50%;font-size:28px;padding:0;z-index:6;box-shadow:0 6px 18px #0008}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.ayah{font-size:12.5px;color:var(--mut);font-style:italic;text-align:center;margin:14px 8px}
.ring{width:64px;height:64px;flex:none}
.mx{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;margin-bottom:10px}.ax{text-align:center;font-size:11.5px;color:var(--mut);font-weight:600}.ay{writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:11.5px;color:var(--mut);font-weight:600}.qc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:110px}.qh{font-size:12px;font-weight:700;margin-bottom:4px}
nav button{font-size:10px!important}nav button b{font-size:18px!important}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const PR=[['fajr','Fajr'],['dhuhr','Dhuhr'],['asr','Asr'],['maghrib','Maghrib'],['isha','Isha']];
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dkey(d)};
const money=n=>(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
let S={salah:{},qaza:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},debts:[],huquq:[],goals:[],targets:[{id:'quran',name:'Quran reading',unit:'pages',goal:2,step:1}],tlog:{},todos:[],drive:{on:false}};
let tab='home',view=null,sampleFn=null,dbDoc=null,syncNote='';
const LS='akhirah_v1';

/* ---------- persistence ---------- */
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const t=localStorage.getItem(LS);return t?JSON.parse(t):null}catch(e){return null}}
function norm(o){o=o||{};if(!o.drive)o.drive={on:false};if(!o.targets)o.targets=[{id:'quran',name:'Quran reading',unit:'pages',goal:2,step:1}];if(!o.tlog)o.tlog={};if(!o.todos)o.todos=[];if(o.salah)for(const k in o.salah)for(const p in o.salah[k]){const v=o.salah[k][p];if(v==='d')o.salah[k][p]='a';else if(v==='m')delete o.salah[k][p]}const d={salah:{},qaza:{fajr:0,dhuhr:0,asr:0,maghrib:0,isha:0},debts:[],huquq:[],goals:[],targets:[],tlog:{},todos:[]};return Object.assign(d,o)}
let saveT=null,saving=false,dirty=false;
function save(){lsSave();dirty=true;schedDrive();if(!dbDoc)return;clearTimeout(saveT);saveT=setTimeout(flush,700)}
async function flush(){if(saving||!dbDoc||!dirty)return;saving=true;dirty=false;try{await dbDoc.set({data:JSON.stringify(S),at:Date.now()});syncNote='Saved privately to your account'}catch(e){syncNote='Saved on this device only'}saving=false;if(dirty)flush()}
async function initDb(){
  S=norm(lsLoad());render();
  try{
    const user=await claude.use('user'),db=await claude.use('db');
    if(!user||!db){syncNote='Saved on this device only';return}
    const id=await user.id();if(!id){syncNote='Sign in to sync privately';return}
    dbDoc=db.collection('data/users/'+id).doc('akhirah');
    let first=true;const timer=setTimeout(()=>{syncNote='Cloud not reachable — using this device';},10000);
    dbDoc.onSnapshot(s=>{clearTimeout(timer);
      if(s.metadata&&s.metadata.hasPendingWrites)return;
      if(s.exists){try{const r=JSON.parse(s.data().data);if(first||!dirty){S=norm(r);lsSave();syncNote='Synced privately';if(!view)render()}}catch(e){}}
      else if(first){dirty=true;flush()}
      first=false;schedDrive();},e=>{syncNote='Saved on this device only'});
  }catch(e){}
  try{sampleFn=await claude.use('sample');if(sampleFn)render()}catch(e){}
}

/* ---------- dialogs ---------- */
function sheet(html,onMount){closeSheet();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML='<div class="sheet">'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)closeSheet()});document.body.appendChild(m);view=1;onMount&&onMount(m)}
function closeSheet(){const m=$('#modal');if(m)m.remove();view=null}
function form(title,fields,onOk,opts={}){
  const h=fields.map(f=>{const v=f.v==null?'':f.v;let inp;
    if(f.t==='area')inp=`<textarea id="f_${f.k}">${esc(v)}</textarea>`;
    else if(f.t==='sel')inp=`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}"${o[0]==v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else inp=`<input id="f_${f.k}" type="${f.t||'text'}" value="${esc(v)}" ${f.t==='number'?'step="any" inputmode="decimal"':''}>`;
    return `<label>${esc(f.l)}</label>${inp}`}).join('');
  sheet(`<h2 style="margin-top:0">${esc(title)}</h2>${h}<div class="row sp" style="margin-top:16px">${opts.del?'<button class="dng" id="fdel">Delete</button>':'<span></span>'}<div class="row"><button id="fx">Cancel</button><button class="pri" id="fok">${opts.ok||'Save'}</button></div></div>`,()=>{
    $('#fx').onclick=closeSheet;
    if(opts.del)$('#fdel').onclick=()=>confirmBox('Delete this?',()=>{opts.del();closeSheet()});
    $('#fok').onclick=()=>{const o={};fields.forEach(f=>{let x=$('#f_'+f.k).value;if(f.t==='number')x=parseFloat(x)||0;o[f.k]=x});if(fields[0].req&&!String(o[fields[0].k]).trim())return;onOk(o);closeSheet()};
    const f0=$('#f_'+fields[0].k);if(f0&&f0.type==='text')setTimeout(()=>f0.focus(),50);
  })}
function confirmBox(msg,yes){sheet(`<h2 style="margin-top:0">${esc(msg)}</h2><div class="row" style="justify-content:flex-end;margin-top:14px"><button id="cn">Cancel</button><button class="pri" id="cy">Yes</button></div>`,()=>{$('#cn').onclick=closeSheet;$('#cy').onclick=()=>{closeSheet();yes()}})}

/* ---------- helpers ---------- */
function ring(p,c='#d9b45a'){const r=26,L=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#0b1511" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${L*p/100} ${L}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="#eef3ee" font-size="15" font-weight="700">${Math.round(p)}%</text></svg>`}
function streak(){let n=0,i=0;const full=k=>{const d=S.salah[k];return d&&PR.every(p=>d[p[0]])};if(!full(today()))i=1;while(full(daysAgo(i))){n++;i++}return n}
function jam7(){let n=0;for(let i=0;i<7;i++){const d=S.salah[daysAgo(i)]||{};PR.forEach(p=>{if(d[p[0]]==='j')n++})}return n}
function qazaTotal(){return PR.reduce((a,p)=>a+(+S.qaza[p[0]]||0),0)}
function debtLeft(d){return Math.max(0,d.amount-(d.paid||0))}
function goalProg(g){let t=0,d=0;(g.ms||[]).forEach(m=>{if(m.tasks&&m.tasks.length){m.tasks.forEach(x=>{t++;if(x.done)d++})}else{t++;if(m.done)d++}});return t?d*100/t:0}
function daysTo(s){if(!s)return null;const a=new Date(s+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((a-b)/864e5)}
function dueTxt(s){const n=daysTo(s);if(n==null)return '';return n<0?`<span class="pill r">${-n}d overdue</span>`:n===0?'<span class="pill y">due today</span>':`<span class="pill">in ${n}d</span>`}

/* ---------- to-do (Eisenhower matrix) ---------- */
const Q=[[1,'Important · Urgent','Do first','#e2685f'],[2,'Important · Not urgent','Schedule','#4fbf8a'],[3,'Not important · Urgent','Quick / delegate','#d9b45a'],[4,'Not important · Not urgent','Later / drop','#6fa8dc']];
function matrix(compact){
  const cell=q=>{const l=S.todos.filter(t=>t.q===q[0]),p=l.filter(t=>!t.done),d=l.length-p.length;
    return `<div class="qc" style="border-top:3px solid ${q[3]}"><div class="qh" style="color:${q[3]}">${q[2]}</div>${p.length?p.map(t=>`<label class="chk" style="padding:3px 0"><input type="checkbox" onchange="tgTodo('${t.id}')"><span style="font-size:13px">${esc(t.t)}</span></label>`).join(''):'<div class="sub" style="padding:4px 0">—</div>'}${d?`<div class="sub">✓ ${d} done</div>`:''}</div>`};
  return `<div class="mx"><div></div><div class="ax">Urgent</div><div class="ax">Not urgent</div>
  <div class="ay">Important</div>${cell(Q[0])}${cell(Q[1])}<div class="ay">Not important</div>${cell(Q[2])}${cell(Q[3])}</div>`}
function vTodo(){
  const sec=q=>{const l=S.todos.filter(t=>t.q===q[0]).sort((a,b)=>a.done-b.done);
    return `<div class="card" style="border-left:4px solid ${q[3]}"><div class="row sp"><b style="color:${q[3]}">${q[1]}</b><span class="pill">${q[2]}</span></div>${l.length?l.map(t=>`<div class="chk ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tgTodo('${t.id}')"><span>${esc(t.t)}</span><button class="ghost sm" onclick="editTodo('${t.id}')">⋯</button></div>`).join(''):'<div class="sub" style="padding:6px 0">Nothing here</div>'}</div>`};
  return `<div class="sub" style="margin:0 2px 8px">Sort every task by importance and urgency. Do the red box first, plan the green box, and keep the others small.</div>${Q.map(sec).join('')}`}
function todoForm(t){return [{k:'t',l:'Task',v:t.t,req:1},{k:'q',l:'Category',t:'sel',o:Q.map(q=>[q[0],q[1]]),v:t.q||1}]}
function addTodo(){form('New to-do',todoForm({}),o=>{S.todos.push({id:uid(),t:o.t,q:+o.q,done:false});save();render()})}
function editTodo(id){const t=S.todos.find(x=>x.id===id);form('Edit to-do',todoForm(t),o=>{t.t=o.t;t.q=+o.q;save();render()},{del:()=>{S.todos=S.todos.filter(x=>x.id!==id);save();render()}})}
function tgTodo(id){const t=S.todos.find(x=>x.id===id);t.done=!t.done;save();setTimeout(render,150)}

/* ---------- daily targets ---------- */
const tv=(id,d)=>((S.tlog[d]||{})[id])||0;
function tStreak(t){let n=0,i=tv(t.id,today())>=t.goal?0:1;while(tv(t.id,daysAgo(i))>=t.goal&&i<400){n++;i++}return n}
function tDoneToday(){return S.targets.filter(t=>tv(t.id,today())>=t.goal).length}
function vDaily(){
  if(!S.targets.length)return '<div class="empty">No daily targets yet. Tap + to add one — Quran reading, dhikr, charity, exercise…</div>';
  const days=[...Array(7)].map((_,i)=>daysAgo(6-i));
  return S.targets.map(t=>{const v=tv(t.id,today()),p=Math.min(100,t.goal?v*100/t.goal:100),ok=v>=t.goal;
    return `<div class="card"><div class="row sp"><b onclick="editTarget('${t.id}')">${esc(t.name)} <span class="dim" style="font-weight:400">⋯</span></b><span class="pill ${ok?'g':'y'}">${ok?'Done ✓':'streak '+tStreak(t)}</span></div>
    <div class="row sp" style="margin:10px 0 6px"><button onclick="tAdd('${t.id}',-1)">−</button><div style="text-align:center"><div class="big">${money(v)} <span class="sub">/ ${money(t.goal)} ${esc(t.unit)}</span></div></div><button class="pri" onclick="tAdd('${t.id}',1)">+${money(t.step||1)}</button></div>
    <div class="bar"><i style="width:${p}%"></i></div>
    <div class="week" style="margin-top:10px;grid-template-columns:repeat(7,1fr)">${days.map(d=>`<span>${d.slice(8)}</span>`).join('')}${days.map(d=>`<span class="dot ${tv(t.id,d)>=t.goal?'j':tv(t.id,d)>0?'q':''}"></span>`).join('')}</div>
    ${ok?'':`<div class="row" style="margin-top:8px"><button class="sm" onclick="tAdd('${t.id}',0)">Mark complete</button></div>`}</div>`}).join('')+'<div class="sub" style="text-align:center">Green = target met · Gold = some progress</div>'}
function tAdd(id,dir){const t=S.targets.find(x=>x.id===id),d=today(),l=S.tlog[d]=S.tlog[d]||{};
  l[id]=dir===0?t.goal:Math.max(0,Math.round(((l[id]||0)+dir*(t.step||1))*100)/100);save();render()}
function tForm(t){return [{k:'name',l:'Target name',v:t.name,req:1},{k:'goal',l:'Daily goal',t:'number',v:t.goal},{k:'unit',l:'Unit (pages, minutes, times…)',v:t.unit},{k:'step',l:'Each + tap adds',t:'number',v:t.step||1}]}
function addTarget(){form('New daily target',tForm({goal:1,unit:'times',step:1}),o=>{S.targets.push({id:uid(),...o,step:o.step||1});save();render()})}
function editTarget(id){const t=S.targets.find(x=>x.id===id);form('Edit target',tForm(t),o=>{Object.assign(t,o,{step:o.step||1});save();render()},{del:()=>{S.targets=S.targets.filter(x=>x.id!==id);save();render()}})}

/* ---------- views ---------- */
function vHome(){
  const t=S.salah[today()]||{},done=PR.filter(p=>t[p[0]]).length;
  const owe=S.debts.filter(d=>d.type==='owe').reduce((a,d)=>a+debtLeft(d),0);
  const pend=S.huquq.filter(h=>h.status!=='settled').length;
  const gp=S.goals.length?S.goals.reduce((a,g)=>a+goalProg(g),0)/S.goals.length:0;
  const od=S.debts.filter(d=>d.type==='owe'&&debtLeft(d)>0&&d.due&&daysTo(d.due)<0).length;
  return `<div class="card row">${ring(done*20,'#4fbf8a')}<div><div class="big">${done}/5 prayers</div><div class="sub">Today · streak ${streak()} day${streak()==1?'':'s'} · qaza owed ${qazaTotal()}</div></div></div>
  <div class="row sp" style="margin:4px 2px 6px"><b>To-do matrix</b><button class="sm" onclick="go('todo')">Open</button></div>${matrix()}
  <div class="card row" onclick="go('daily')"><div class="big">${tDoneToday()}/${S.targets.length}</div><div><b>Daily targets</b><div class="sub">${S.targets.length?S.targets.map(t=>esc(t.name)).slice(0,3).join(' · '):'Add targets like Quran reading'}</div></div></div>
  <div class="grid">
  <div class="card" onclick="go('debts')"><div class="sub">Debts I owe</div><div class="big" style="color:${owe?'var(--red)':'var(--grn)'}">${money(owe)}</div><div class="sub">${od?od+' overdue':owe?'pay early if you can':'all clear'}</div></div>
  <div class="card" onclick="go('huquq')"><div class="sub">Rights to settle</div><div class="big" style="color:${pend?'var(--gold)':'var(--grn)'}">${pend}</div><div class="sub">${pend?'people to make right':'none pending'}</div></div></div>
  <div class="card row" onclick="go('goals')">${ring(gp)}<div><div class="big" style="font-size:19px">Life goals</div><div class="sub">${S.goals.length} goal${S.goals.length==1?'':'s'} · average progress</div></div></div>
  <div class="ayah">“Every soul will taste death… and you will only be given your full compensation on the Day of Resurrection.” — Qur’an 3:185</div>`}

function vSalah(){
  const t=S.salah[today()]||{};
  const rows=PR.map(([k,n])=>`<div class="pr"><div><b>${n}</b> ${S.qaza[k]?`<span class="pill y">backlog ${S.qaza[k]}</span>`:''}</div><div class="seg"><button class="${t[k]==='j'?'j':''}" onclick="mark('${k}','j')">Jama‘ah</button><button class="${t[k]==='a'?'a':''}" onclick="mark('${k}','a')">Alone</button><button class="${t[k]==='q'?'q':''}" onclick="mark('${k}','q')">Qaza</button></div></div>`).join('');
  const days=[...Array(7)].map((_,i)=>daysAgo(6-i));
  const wk=`<div class="week"><span></span>${days.map(d=>`<span>${d.slice(8)}</span>`).join('')}</div>`+PR.map(([k,n])=>`<div class="week" style="margin-top:4px"><span style="text-align:left">${n}</span>${days.map(d=>`<span class="dot ${((S.salah[d]||{})[k])||''}" onclick="markDay('${d}','${k}')"></span>`).join('')}</div>`).join('');
  const qz=PR.map(([k,n])=>`<div class="row sp" style="padding:6px 0"><span>${n}</span><span class="row"><button class="sm" onclick="qz('${k}',-1)">− made up</button><b style="min-width:30px;text-align:center">${S.qaza[k]||0}</b><button class="sm" onclick="qz('${k}',1)">+</button></span></div>`).join('');
  return `<div class="card"><div class="row sp"><b>Today</b><span class="pill g">streak ${streak()} · jama‘ah this week ${jam7()}</span></div>${rows}</div>
  <div class="card"><b>Last 7 days</b><div class="sub" style="margin-bottom:8px">Tap a square to cycle: Jama‘ah → Alone → Qaza → none. <span style='color:var(--grn)'>■</span> Jama‘ah <span style='color:#6fa8dc'>■</span> Alone <span style='color:var(--gold)'>■</span> Qaza</div>${wk}</div>
  <div class="card"><b>Qaza (make-up) prayers</b><div class="sub">Your backlog of old missed prayers. Set it with +, and tap “− made up” each time you pray one.</div>${qz}<div class="row sp" style="margin-top:6px"><b>Total owed</b><b>${qazaTotal()}</b></div></div>`}
function setMark(d,k,v){const day=S.salah[d]=S.salah[d]||{};if(day[k]===v)delete day[k];else day[k]=v;save();render()}
function mark(k,v){setMark(today(),k,v)}
function markDay(d,k){const o=((S.salah[d]||{})[k])||'';const n={'':'j',j:'a',a:'q',q:''}[o];const day=S.salah[d]=S.salah[d]||{};if(n)day[k]=n;else delete day[k];save();render()}
function qz(k,n){S.qaza[k]=Math.max(0,(S.qaza[k]||0)+n);save();render()}

function vDebts(){
  const mk=type=>{const l=S.debts.filter(d=>d.type===type).sort((a,b)=>(debtLeft(a)===0)-(debtLeft(b)===0)||(a.due||'9')>(b.due||'9')?1:-1);
    if(!l.length)return '<div class="empty">Nothing here</div>';
    return l.map(d=>{const left=debtLeft(d),p=d.amount?(d.paid||0)*100/d.amount:100;return `<div class="card" onclick="editDebt('${d.id}')"><div class="row sp"><b>${esc(d.person)}</b><b style="color:${left?(type==='owe'?'var(--red)':'var(--gold)'):'var(--grn)'}">${left?money(left):'Cleared ✓'}</b></div><div class="sub">${d.note?esc(d.note)+' · ':''}of ${money(d.amount)} ${dueTxt(left?d.due:'')}</div><div class="bar" style="margin:8px 0"><i style="width:${p}%"></i></div>${left?`<button class="sm" onclick="event.stopPropagation();payDebt('${d.id}')">${type==='owe'?'Record payment':'Record received'}</button>`:''}</div>`}).join('')};
  const owe=S.debts.filter(d=>d.type==='owe').reduce((a,d)=>a+debtLeft(d),0),owed=S.debts.filter(d=>d.type==='owed').reduce((a,d)=>a+debtLeft(d),0);
  return `<div class="grid"><div class="card"><div class="sub">I owe</div><div class="big" style="color:var(--red)">${money(owe)}</div></div><div class="card"><div class="sub">Owed to me</div><div class="big" style="color:var(--gold)">${money(owed)}</div></div></div>
  <div class="sub" style="margin:0 4px 6px">The Prophet ﷺ said a believer’s soul stays bound to their debt until it is paid. Prioritise clearing what you owe, and consider forgiving what is owed to you.</div>
  <h2>I owe</h2>${mk('owe')}<h2>Owed to me</h2>${mk('owed')}`}
function debtForm(d){return [{k:'person',l:'Person / lender',v:d.person,req:1},{k:'amount',l:'Total amount',t:'number',v:d.amount},{k:'due',l:'Due date (optional)',t:'date',v:d.due},{k:'note',l:'Note',v:d.note}]}
function addDebt(type){form(type==='owe'?'Debt I owe':'Money owed to me',debtForm({}),o=>{S.debts.push({id:uid(),type,paid:0,...o});save();render()})}
function editDebt(id){const d=S.debts.find(x=>x.id===id);form('Edit',debtForm(d),o=>{Object.assign(d,o);save();render()},{del:()=>{S.debts=S.debts.filter(x=>x.id!==id);save();render()}})}
function payDebt(id){const d=S.debts.find(x=>x.id===id);form('Amount (left '+money(debtLeft(d))+')',[{k:'a',l:'Amount',t:'number',v:debtLeft(d)}],o=>{d.paid=Math.min(d.amount,(d.paid||0)+o.a);save();render()},{ok:'Record'})}

const HK=[['money','Money / property'],['apology','Apology needed'],['wrong','Backbiting / slander / hurt'],['belong','Belongings to return'],['family','Family / parents / spouse rights'],['other','Other']];
const HS={pending:['Pending','y'],progress:['In progress','y'],settled:['Settled ✓','g']};
function vHuquq(){
  const l=[...S.huquq].sort((a,b)=>(a.status==='settled')-(b.status==='settled'));
  const n=S.huquq.filter(h=>h.status==='settled').length;
  return `<div class="card"><div class="row sp"><b>${n}/${S.huquq.length} settled</b><span class="sub">Huquq al-Ibad</span></div><div class="bar" style="margin-top:8px"><i style="width:${S.huquq.length?n*100/S.huquq.length:0}%"></i></div><div class="sub" style="margin-top:8px">Rights of people are not forgiven by Allah until the person forgives. List who you may have wronged and what you can do to make it right.</div></div>
  ${l.length?l.map(h=>`<div class="card" onclick="editHuquq('${h.id}')"><div class="row sp"><b>${esc(h.person)}</b><span class="pill ${HS[h.status][1]}">${HS[h.status][0]}</span></div><div class="sub">${esc((HK.find(k=>k[0]===h.kind)||HK[5])[1])}${h.amount?' · '+money(h.amount):''}</div>${h.desc?`<div style="margin-top:4px">${esc(h.desc)}</div>`:''}${h.plan?`<div class="sub" style="margin-top:4px">Plan: ${esc(h.plan)}</div>`:''}<div class="row" style="margin-top:8px"><button class="sm" onclick="event.stopPropagation();cycH('${h.id}')">${h.status==='settled'?'Reopen':h.status==='pending'?'Start':'Mark settled'}</button></div></div>`).join(''):'<div class="empty">No entries yet. Tap + to add someone you need to make right with.</div>'}`}
function huForm(h){return [{k:'person',l:'Person',v:h.person,req:1},{k:'kind',l:'Type',t:'sel',o:HK,v:h.kind||'money'},{k:'amount',l:'Amount (if money)',t:'number',v:h.amount||''},{k:'desc',l:'What happened',t:'area',v:h.desc},{k:'plan',l:'How I will make it right',t:'area',v:h.plan}]}
function addHuquq(){form('New right to settle',huForm({}),o=>{S.huquq.push({id:uid(),status:'pending',...o});save();render()})}
function editHuquq(id){const h=S.huquq.find(x=>x.id===id);form('Edit',huForm(h),o=>{Object.assign(h,o);save();render()},{del:()=>{S.huquq=S.huquq.filter(x=>x.id!==id);save();render()}})}
function cycH(id){const h=S.huquq.find(x=>x.id===id);h.status=h.status==='pending'?'progress':h.status==='progress'?'settled':'pending';save();render()}

const GC=[['deen','Deen'],['family','Family'],['career','Career / wealth'],['health','Health'],['knowledge','Knowledge'],['charity','Charity / sadaqah'],['other','Other']];
function vGoals(){
  if(!S.goals.length)return '<div class="empty">No goals yet. Tap + to add a life goal, then break it into milestones and small tasks.</div>';
  return S.goals.map(g=>`<div class="card" onclick="openGoal('${g.id}')"><div class="row">${ring(goalProg(g))}<div style="flex:1"><b>${esc(g.title)}</b><div class="sub">${esc((GC.find(c=>c[0]===g.cat)||GC[6])[1])}${g.date?' · '+dueTxt(g.date).replace(/<[^>]+>/g,''):''}</div><div class="sub">${(g.ms||[]).length} milestones</div></div></div></div>`).join('')}
let curGoal=null;
function openGoal(id){curGoal=id;tab='goal';render()}
function vGoal(){
  const g=S.goals.find(x=>x.id===curGoal);if(!g){tab='goals';return vGoals()}
  const ms=(g.ms||[]).map(m=>{const hasT=m.tasks&&m.tasks.length;const tp=hasT?m.tasks.filter(t=>t.done).length+'/'+m.tasks.length:'';
    return `<div class="card"><div class="chk ${(!hasT&&m.done)?'done':''}">${hasT?'<span style="flex:none">◆</span>':`<input type="checkbox" ${m.done?'checked':''} onchange="tgM('${m.id}')">`}<span><b>${esc(m.t)}</b> ${tp?`<span class="pill">${tp}</span>`:''}</span><button class="ghost sm" onclick="editM('${m.id}')">⋯</button></div><div class="ms">${(m.tasks||[]).map(t=>`<label class="chk ${t.done?'done':''}" style="margin:0"><input type="checkbox" ${t.done?'checked':''} onchange="tgT('${m.id}','${t.id}')"><span>${esc(t.t)}</span><button class="ghost sm" onclick="event.preventDefault();delT('${m.id}','${t.id}')">✕</button></label>`).join('')}<button class="sm" style="margin-top:4px" onclick="addT('${m.id}')">+ small step</button></div></div>`}).join('');
  return `<div class="row sp" style="margin-bottom:8px"><button class="ghost" onclick="tab='goals';render()">‹ Goals</button><button class="ghost" onclick="editGoal('${g.id}')">Edit</button></div>
  <div class="card row">${ring(goalProg(g))}<div><b style="font-size:17px">${esc(g.title)}</b>${g.why?`<div class="sub">Why: ${esc(g.why)}</div>`:''}${g.date?`<div style="margin-top:4px">${dueTxt(g.date)}</div>`:''}</div></div>
  ${ms||'<div class="empty">Break this goal into milestones (big phases), then add small steps under each.</div>'}
  <div class="row" style="margin-top:6px"><button class="pri" onclick="addM()">+ Milestone</button>${sampleFn?'<button id="aiBtn" onclick="aiBreak()">✨ Suggest breakdown</button>':''}</div><div id="aiMsg" class="sub" style="margin-top:8px"></div>`}
function addGoal(){form('New life goal',[{k:'title',l:'Goal',req:1},{k:'cat',l:'Area',t:'sel',o:GC,v:'deen'},{k:'why',l:'Why it matters (for the Akhirah)'},{k:'date',l:'Target date',t:'date'}],o=>{const g={id:uid(),ms:[],...o};S.goals.push(g);save();openGoal(g.id)})}
function editGoal(id){const g=S.goals.find(x=>x.id===id);form('Edit goal',[{k:'title',l:'Goal',v:g.title,req:1},{k:'cat',l:'Area',t:'sel',o:GC,v:g.cat},{k:'why',l:'Why',v:g.why},{k:'date',l:'Target date',t:'date',v:g.date}],o=>{Object.assign(g,o);save();render()},{del:()=>{S.goals=S.goals.filter(x=>x.id!==id);tab='goals';save();render()}})}
const G=()=>S.goals.find(x=>x.id===curGoal);
const MS=id=>G().ms.find(m=>m.id===id);
function addM(){form('New milestone',[{k:'t',l:'Milestone',req:1}],o=>{G().ms.push({id:uid(),t:o.t,done:false,tasks:[]});save();render()})}
function editM(id){const m=MS(id);form('Edit milestone',[{k:'t',l:'Milestone',v:m.t,req:1}],o=>{m.t=o.t;save();render()},{del:()=>{G().ms=G().ms.filter(x=>x.id!==id);save();render()}})}
function addT(id){form('New small step',[{k:'t',l:'Step (small enough to do in one sitting)',req:1}],o=>{MS(id).tasks.push({id:uid(),t:o.t,done:false});save();render()})}
function tgM(id){const m=MS(id);m.done=!m.done;save();render()}
function tgT(m,t){const x=MS(m).tasks.find(y=>y.id===t);x.done=!x.done;save();render()}
function delT(m,t){const mm=MS(m);mm.tasks=mm.tasks.filter(y=>y.id!==t);save();render()}
async function aiBreak(){const g=G(),b=$('#aiBtn'),msg=$('#aiMsg');b.disabled=true;msg.textContent='Thinking…';
  try{const r=await sampleFn.json(`A Muslim is planning a life goal for the sake of Allah and the Akhirah. Goal: "${g.title}". Why: "${g.why||''}". Target date: ${g.date||'none'}. Existing milestones: ${(g.ms||[]).map(m=>m.t).join('; ')||'none'}.\nBreak it into 3-5 milestones, each with 2-4 small concrete steps (each doable in one sitting). Reply with only JSON: [{"t":"milestone","tasks":["step","step"]}]`,{modelTier:'default',cache:false});
    if(!Array.isArray(r))throw 0;r.slice(0,6).forEach(m=>{if(m&&m.t)g.ms.push({id:uid(),t:String(m.t),done:false,tasks:(m.tasks||[]).slice(0,6).map(x=>({id:uid(),t:String(x),done:false}))})});save();render()}
  catch(e){msg.textContent='Could not generate a suggestion right now.';b.disabled=false}}

/* ---------- Google Drive auto-backup ---------- */
const DRV='Google Drive';let driveBusy=false,dTimer=null,driveErr='';
function hashS(){const o=Object.assign({},S);delete o.drive;const t=JSON.stringify(o);let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h+':'+t.length}
function idOf(p){if(typeof p==='string'){try{p=JSON.parse(p)}catch(e){return null}}if(!p||typeof p!=='object')return null;if(p.id)return p.id;if(p.file&&p.file.id)return p.file.id;const a=p.files||p.items;return Array.isArray(a)&&a[0]&&a[0].id?a[0].id:null}
function errText(e){const c=e&&e.code;return c==='server_not_connected'||c==='server_not_found'?'Google Drive is not connected. Add it in Claude Settings → Connectors.':c==='needs_reauth'?'Reconnect Google Drive in Claude Settings → Connectors.':c==='not_in_manifest'||c==='approval_required'?'Drive access was not allowed. Tap “Back up now” and choose Allow.':c==='blocked_by_policy'?'Your organisation blocks Google Drive here.':c==='none'?'Drive backup works only inside the Claude app. Use Export backup here.':'Backup failed — it will try again later.'}
function schedDrive(){const D=S.drive;if(!D||!D.on)return;clearTimeout(dTimer);const w=D.lastAt?Math.max(60000,D.lastAt+3*3600e3-Date.now()):60000;dTimer=setTimeout(()=>driveBackup(false),w)}
async function driveBackup(manual){
  const D=S.drive;if(!D||!D.on||driveBusy)return;
  const h=hashS();if(!manual&&h===D.lastHash)return;
  driveBusy=true;driveErr='';
  try{
    const mcp=await claude.use('mcp');if(!mcp)throw {code:'none'};
    if(!D.folderId){
      const r=await mcp.callTool(DRV,'search_files',{query:"title = 'Life App Backups' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",excludeContentSnippets:true});
      let id=idOf(r.payload);
      if(!id){const c=await mcp.callTool(DRV,'create_file',{title:'Life App Backups',mimeType:'application/vnd.google-apps.folder'});id=idOf(c.payload)}
      if(!id)throw {code:'x'};D.folderId=id}
    const n=new Date(),day=dkey(n),title='Life App backup '+day+' '+pad(n.getHours())+'-'+pad(n.getMinutes())+'.json';
    const c=await mcp.callTool(DRV,'create_file',{title,textContent:JSON.stringify(S),contentMimeType:'application/json',disableConversionToGoogleType:true,parentId:D.folderId});
    const nid=idOf(c.payload);
    if(nid&&D.lastId&&D.lastDay===day){try{await mcp.callTool(DRV,'trash_file',{fileId:D.lastId})}catch(e){}}
    D.lastId=nid||null;D.lastDay=day;D.lastAt=Date.now();D.lastHash=h;D.lastName=title;save();
  }catch(e){driveErr=errText(e);if(e&&e.code==='tool_error'&&D.folderId)D.folderId=null}
  driveBusy=false;const el=document.getElementById('gd-st');if(el)el.innerHTML=driveStatus();schedDriveRetry()}
function schedDriveRetry(){if(driveErr&&S.drive.on){clearTimeout(dTimer);dTimer=setTimeout(()=>driveBackup(false),30*60000)}}
function driveStatus(){const D=S.drive;if(driveErr)return '<span style="color:var(--red)">'+esc(driveErr)+'</span>';if(driveBusy)return 'Backing up…';if(!D.on)return 'Off';return D.lastAt?'On · last backup '+new Date(D.lastAt).toLocaleString():'On · first backup soon'}

/* ---------- settings ---------- */
function settings(){sheet(`<h2 style="margin-top:0">Backup & data</h2><div class="sub" id="stat">${esc(syncNote||'Saved on this device')}</div>
<div class="row" style="margin-top:12px;flex-wrap:wrap"><button id="ex">Export backup</button>
<span style="position:relative;display:inline-block"><button style="pointer-events:none">Import from file</button><input type="file" id="fi" accept="*/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer"></span></div>
<h2>Google Drive auto-backup</h2><div class="sub">Saves a copy to a “Life App Backups” folder in your Drive after changes (at most every 3 hours, keeping one file per day). It runs while the app is open.</div><div class="sub" id="gd-st" style="margin:6px 0">${driveStatus()}</div><div class="row" style="flex-wrap:wrap"><button class="pri" id="gd-on">${S.drive.on?'Back up now':'Turn on'}</button>${S.drive.on?'<button id="gd-off">Turn off</button>':''}</div>
<label>Or paste backup text here</label><textarea id="pt" placeholder="Paste the contents of your backup file"></textarea>
<div class="row" style="justify-content:space-between;margin-top:12px"><button id="pi">Import pasted text</button><button id="cl">Close</button></div>`,()=>{
  const st=m=>{$('#stat').textContent=m};
  const load=txt=>{try{const o=JSON.parse(txt);if(!o||typeof o!=='object'||Array.isArray(o)||!('salah' in o||'debts' in o||'goals' in o||'huquq' in o||'targets' in o))throw 0;const keep=S.drive;S=norm(o);S.drive=keep;save();closeSheet();render()}catch(x){st('That does not look like an Life App backup.')}};
  $('#cl').onclick=closeSheet;
  $('#gd-on').onclick=async()=>{S.drive.on=true;save();$('#gd-st').textContent='Backing up…';await driveBackup(true);if(!driveErr)render()};
  if($('#gd-off'))$('#gd-off').onclick=()=>{S.drive.on=false;clearTimeout(dTimer);save();closeSheet();settings()};
  $('#pi').onclick=()=>{const t=$('#pt').value.trim();if(!t){st('Paste the backup text first.');return}load(t)};
  $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;st('Reading '+f.name+'…');const r=new FileReader();r.onload=()=>load(String(r.result));r.onerror=()=>st('Could not read that file. Try pasting the text instead.');r.readAsText(f)};
  $('#ex').onclick=async()=>{const data=JSON.stringify(S,null,1),name='lifeapp-backup-'+today()+'.json';try{if(window.Android&&window.Android.saveFile){window.Android.saveFile(name,'application/json',btoa(unescape(encodeURIComponent(data))));st('Backup saved to Downloads/LifeApp.');return}const d=await claude.use('downloads');if(d){await d.save({filename:name,data});st('Backup saved.');return}}catch(e){}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()}catch(e){}
    $('#pt').value=data;st('Download unavailable — backup text placed below; copy it and keep it safe.')}})}

/* ---------- shell ---------- */
function go(t){tab=t;render();scrollTo(0,0)}
function render(){
  if(view)return;
  const T=[['home','🏠','Home'],['salah','🕌','Salah'],['daily','📖','Daily'],['todo','✅','To-do'],['debts','💰','Debts'],['huquq','🤝','Huquq'],['goals','🎯','Goals']];
  const titles={todo:'To-do',daily:'Daily Targets',home:'Life App',salah:'Salah',debts:'Debts',huquq:'Huquq al-Ibad',goals:'Life Goals',goal:'Life Goals'};
  const body={todo:vTodo,daily:vDaily,home:vHome,salah:vSalah,debts:vDebts,huquq:vHuquq,goals:vGoals,goal:vGoal}[tab]();
  const fab={todo:'addTodo()',daily:'addTarget()',debts:'addDebtMenu()',huquq:'addHuquq()',goals:'addGoal()'}[tab];
  $('#app').innerHTML=`<header><div><h1>${titles[tab]}</h1><div class="sub">بسم الله · prepare for the meeting with your Lord</div></div><button class="ghost" onclick="settings()" aria-label="Backup">⚙︎</button></header>${body}${fab?`<button class="pri fab" onclick="${fab}">+</button>`:''}<nav>${T.map(t=>`<button class="${(tab===t[0]||(tab==='goal'&&t[0]==='goals'))?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`}
function addDebtMenu(){sheet(`<h2 style="margin-top:0">Add</h2><div class="row" style="flex-direction:column;align-items:stretch"><button class="pri" id="d1">Debt I owe</button><button id="d2">Money owed to me</button><button id="d3">Cancel</button></div>`,()=>{$('#d1').onclick=()=>{closeSheet();addDebt('owe')};$('#d2').onclick=()=>{closeSheet();addDebt('owed')};$('#d3').onclick=closeSheet})}
render();initDb();
</script></body></html>
